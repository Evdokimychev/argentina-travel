# Supabase CLI — https://supabase.com/docs/guides/cli
# Link: supabase link --project-ref ejseeuszipxwvdeuqamc

project_id = "ejseeuszipxwvdeuqamc"

[db]
major_version = 15

# Auth emails — branded templates for local CLI (`supabase start`).
# Production: copy HTML from supabase/templates/ into Dashboard → Authentication → Email Templates.
# See docs/auth-email-setup.md

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.confirmation]
subject = "Подтвердите регистрацию — Пора в Аргентину"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Восстановление пароля — Пора в Аргентину"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Подтверждение смены email — Пора в Аргентину"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Ссылка для входа — Пора в Аргентину"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Приглашение на «Пора в Аргентину»"
content_path = "./supabase/templates/invite.html"

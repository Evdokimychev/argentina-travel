name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: jobs only need repository contents (checkout + artifacts).
# production-acceptance uses public HTTPS smoke; no write tokens required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_SHA: ${{ github.sha }}
  DEPLOY_ENV: preview
  NEXT_PUBLIC_APP_MODE: production
  NEXT_PUBLIC_ENABLE_DEMO_SEED: "false"
  # CI deliberately has no Supabase credentials. Keep the required public
  # configuration non-empty, but point it at a closed local port so server
  # fallbacks fail immediately instead of waiting on a fake external host.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SUPABASE_AUTH: "true"
  NEXT_PUBLIC_TOURS_SOURCE: supabase
  NEXT_PUBLIC_SITE_URL: https://www.goargentina.ru

jobs:
  # Sprint 7: parallel CI — same evidence groups as before, wall-clock reduced.
  # Contracts path does not install Playwright; release path owns build/journeys/LH.
  verify-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contracts release gate (static + contracts + security + commerce)
        run: npm run release:gate -- --group static,contracts,security,commerce

      - name: Upload contracts gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-contracts-${{ github.sha }}
          path: |
            var/ops/release-gate-report.json
            var/ops/release-gate-*-last.json
            var/ops/release-gate-logs/
          if-no-files-found: error

  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for knowledge validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-content.txt

      - name: Install knowledge validation dependencies
        run: python -m pip install --requirement requirements-content.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Release gate (content + production + journeys)
        run: npm run release:gate -- --group content,production,journeys

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-release-${{ github.sha }}
          path: |
            var/ops/release-gate-report.json
            var/ops/release-gate-*-last.json
            var/ops/release-gate-logs/
          if-no-files-found: error

      - name: Bundle size report
        env:
          BUNDLE_REPORT_FILE: var/ops/bundle-report.md
        run: npm run bundle:report
        continue-on-error: true

      - name: Blocking public performance budgets (3 cold mobile runs)
        env:
          LIGHTHOUSE_BASE_URL: http://127.0.0.1:3000
          LIGHTHOUSE_START_TIMEOUT_MS: 180000
          LIGHTHOUSE_RUNS_PER_PATH: "3"
          LIGHTHOUSE_RUN_TIMEOUT_MS: "90000"
          LIGHTHOUSE_CHROME_CLEANUP_DELAY_MS: "2000"
          LIGHTHOUSE_MANAGE_SERVER: "1"
        run: node scripts/lighthouse-phase2-ci.mjs

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-budgets-${{ github.sha }}
          path: |
            var/ops/lighthouse-phase2-sample-last.json
            var/ops/lh-*.json
          if-no-files-found: error

      - name: E2E UX audit
        run: npm run test:e2e:ux-audit
        continue-on-error: true

  # Compatibility alias: GitHub branch protection / dashboards expecting "verify"
  verify:
    runs-on: ubuntu-latest
    needs: [verify-contracts, verify-release]
    steps:
      - name: Confirm parallel gates
        run: echo "verify-contracts + verify-release both green"

  production-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      PLAYWRIGHT_BASE_URL: https://www.goargentina.ru
      SMOKE_BASE_URL: https://www.goargentina.ru
      EXPECTED_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for matching production deployment
        run: |
          # Health may return HTTP 503 while still exposing gitSha when DB is down.
          # Do not use curl --fail: we need the JSON body to verify the deployed SHA.
          for attempt in {1..30}; do
            deployed_sha="$(curl --silent --show-error https://www.goargentina.ru/api/health | jq --raw-output '.gitSha // empty' || true)"
            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              echo "Production is serving $deployed_sha"
              exit 0
            fi
            echo "Waiting for production SHA $GITHUB_SHA (currently ${deployed_sha:-unavailable})"
            sleep 20
          done
          exit 1

      - name: Production smoke
        run: npm run production-smoke

      - name: Stage 2 visual acceptance
        run: npm run test:e2e:stage2-visual

      - name: Upload Stage 2 visual gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-visual-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn

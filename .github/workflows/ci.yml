name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      DEPLOY_ENV: production
      NEXT_PUBLIC_APP_MODE: production
      NEXT_PUBLIC_ENABLE_DEMO_SEED: "false"
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_AUTH: "true"
      NEXT_PUBLIC_TOURS_SOURCE: supabase
      NEXT_PUBLIC_SITE_URL: https://www.goargentina.ru

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Mandatory release gate
        run: npm run release:gate

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: |
            var/ops/release-gate-report.json
            var/ops/release-gate-logs/
          if-no-files-found: error

      - name: Bundle size report
        run: npm run bundle:report
        continue-on-error: true

      - name: Lighthouse blog CWV
        env:
          LIGHTHOUSE_BASE_URL: http://127.0.0.1:3000
          LIGHTHOUSE_START_TIMEOUT_MS: 180000
          LIGHTHOUSE_CATEGORIES: performance,accessibility
          LIGHTHOUSE_SAMPLE_PATHS: /blog,/blog/authors,/blog/hub/patagonia,/blog/patagonia-packing-list,/blog/natsionalnyy-park-iguasu
        run: node scripts/lighthouse-ci.mjs
        continue-on-error: true

      - name: E2E UX audit
        run: npm run test:e2e:ux-audit
        continue-on-error: true

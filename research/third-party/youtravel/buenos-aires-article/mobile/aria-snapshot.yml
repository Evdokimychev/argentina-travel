  - paragraph
  - heading "Еда и напитки" [level=3]
  - paragraph: Жители Буэнос-Айреса, которых называют портеньос, любят есть вне дома, поэтому в городе много кафе и ресторанов. Учтите, что многие заведения в Латинской Америке закрываются в середине дня или устраивают выходной посреди недели. По праздникам и воскресеньям большинство мест закрыто, и это касается не только кафе. Даже продуктовые магазины у дома не работают. Перед визитом лучше проверять график в картах, но доверять ему на 100% всё равно не стоит.
  - paragraph
  - img "Улица"
  - paragraph
  - text: "В Буэнос-Айресе более 70 так называемых bares notables — баров и кафе, признанных частью культурного наследия города за их историческую и архитектурную ценность. Например, Café Tortoni, старейшее кафе города. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%B9%D0%BB:Buenos_Aires_-_Avenida_de_Mayo_825_-_Caf%C3%A9_Tortoni.jpg
  - paragraph
  - paragraph
  - paragraph
  - blockquote:
    - paragraph: В Аргентине стоит обязательно попробовать асадо — аргентинское жареное мясо. На мой вкус, это лучшее мясо в мире. А на сладкое там популярна дульсе де лече — карамельная сгущёнка, которую добавляют чуть ли не во все десерты.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph: "Асадо — аргентинский вариант барбекю. Готовят разные виды мяса: стейки, рёбра, колбаски чоризо. Один из самых неожиданных вариантов — жареное говяжье вымя, которое часто есть в меню."
  - paragraph: "Также в Аргентине можно наесться пирожков эмпанадас. Блюдо иногда жарят во фритюре, но чаще запекают в духовке. Начинки бывают самые разные: ветчина с сыром, мясо, курица, овощи."
  - paragraph
  - img "Еда"
  - paragraph
  - text: Так выглядит асадо (слева) и эмпанадас (справа)
  - paragraph
  - paragraph
  - paragraph: Ещё один гастрономический мастхэв — миланеза. Это тонко отбитое мясо в панировке, что-то вроде аргентинского шницеля. Обычно его подают с картошкой или салатом.
  - paragraph: "Из сладкого здесь особенно любят медиалуны — местную версию круассана. Они меньше, плотнее и чуть слаще французских. В кафе всегда есть выгодное комбо: две медиалуны и кофе. Кстати, кофе в Аргентине очень вкусный."
  - paragraph: Ну и, конечно, вино. Самый известный сорт — мальбек. Бутылки местного вина стоят примерно 400–500 ₽. Почти всё родом из Мендосы, региона в центре страны.
  - paragraph
  - img "Еда"
  - paragraph
  - text: "Вино мальбек и медиалуна с кофе. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Поездка в Буэнос-Айрес вряд ли обойдётся без мате. Это чай из листьев падуба, который содержит матеин — бодрящий компонент, похожий на кофеин. Напиток горький, травяной — скорее всего, с непривычки он покажется странным.
  - paragraph: Этот напиток — важная часть местной культуры. Его пьют из специальной чаши через металлическую трубочку — бомбилью. Обычно один человек заваривает мате и по очереди передаёт чашу всем остальным.
  - paragraph
  - img "Напиток"
  - paragraph
  - text: Человека, который доливает горячую воду и передаёт мате дальше, называют себадор
  - paragraph
  - heading "Культура" [level=3]
  - paragraph: Футбол. В Буэнос-Айресе самая высокая в мире концентрация профессиональных футбольных клубов. И этот спорт в Аргентине — важная часть культуры. Дети растут с мячом во дворе, а обсуждение клубов, кажется, звучит чаще, чем прогноз погоды.
  - paragraph: Дважды в год там проводят суперкласико — матчи, когда на поле выходят главные команды «Боку Хуниорс» и «Ривер Плейт». За ними следит буквально вся страна. А издание The Guardian включило суперкласико в Буэнос-Айресе в список «50 спортивных развлечений, которые надо увидеть в жизни».
  - paragraph
  - img "Стадион"
  - paragraph
  - text: Футбольная сборная Аргентины несколько раз становилась чемпионом мира
  - paragraph
  - paragraph
  - paragraph: Танго. Танец, который родился в Аргентине. В Буэнос-Айресе множество школ, где дают уроки начинающим. А 11 декабря здесь отмечают Международный день танго и танцуют буквально везде. В остальное время можно посетить красивые шоу.
  - paragraph
  - blockquote:
    - paragraph: В Буэнос-Айресе проводят множество шоу, где танцуют танго, а также его добавляют в вечерние программы туристические рестораны. На улицах танцоров тоже можно увидеть. Если есть желание потанцевать, ищите милонги — места, где гости сами танцуют танго, иногда вместе с профессиональными танцорами. Их довольно много в городе, самые известные — El Beso и Milonga La Nacional.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - heading "Язык" [level=3]
  - paragraph: "В Аргентине почти не говорят на английском. Более-менее вас смогут понять только в некоторых туристических местах. Если не знаете испанский, заранее установите офлайн-переводчик с испанским языком: например, «Яндекс.Переводчик» или Google Translate. Он пригодится, чтобы спросить дорогу, заказать еду в кафе или объясниться в отеле, если интернета не будет."
  - paragraph:
    - text: Чужой опыт, который стоит учесть →
    - link "Ошибки путешественников":
      - /url: https://youtravel.me/blog/layfkhaki-dlya-puteshestviy/oshibki-pri-planirovanii-puteshestviya
  - paragraph
  - heading "Что посмотреть в Буэнос-Айресе" [level=2]
  - heading "Исторический центр" [level=3]
  - paragraph: Центр Буэнос-Айреса — место с плотной исторической застройкой, множеством отелей и офисов. Местные здесь почти не живут. Во время путешествия сюда стоит заглянуть, чтобы посмотреть старинную архитектуру. По отзывам путешественников, здесь можно столкнуться с карманниками. Следите за вещами особенно внимательно.
  - paragraph: Пласа-де-Майо, или Майская площадь, — старейшая точка Буэнос-Айреса. Город начали строить именно здесь, а название площадь получила в честь революции 25 мая 1810 года — это ключевое событие в истории Аргентины. С него началась независимость страны от испанского правительства.
  - paragraph: На площади находится Каса Росада — официальная резиденция главы Аргентины. Когда-то на этом месте стоял форт, а современное здание построили в 19 веке. Там же работает музей Дома правительства, куда можно попасть с экскурсией.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Президентский дворец окрашен в розовый цвет. По одной из теорий, в 19 веке для покраски зданий использовали известь, смешанную с бычьей кровью. Считается, что она помогала защищать стены от сырости и протечек. Фото: Анна Тихая"
  - paragraph
  - img "Собор"
  - paragraph
  - text: "На площади Майо также находится кафедральный собор — главный католический храм страны. Так он выглядит внутри. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Кабильдо — старинная городская ратуша, которую построили в 1580 году. Раньше в здании находилась администрация испанской власти. Члены совета — кабильденсес — управляли городом.
  - paragraph: В 1810 году это место стало центром Майской революции. Лидеры одного из движений собрались здесь 22 мая, чтобы обсудить власть вице-короля и испанского правительства.
  - paragraph: Обелиск на площади Республики построили в 1936 году к 400-летию Буэнос-Айреса на месте, где впервые в городе вывесили аргентинский флаг. Во время важных событий обелиск превращают в экран для световых инсталляций. А спортивные болельщики часто собираются около него, чтобы отпраздновать победу своей команды.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Во внутреннем дворе Кабильдо стоит цистерна 1835 года. Она принадлежала дому, где родился и умер Мануэль Бельграно, военный, политик и создатель аргентинского флага. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%A0%D0%B0%D1%82%D1%83%D1%88%D0%B0_%D0%91%D1%83%D1%8D%D0%BD%D0%BE%D1%81-%D0%90%D0%B9%D1%80%D0%B5%D1%81%D0%B0#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Cabildo_de_Buenos_Aires_2023.jpg
  - paragraph
  - img "Обелиск"
  - paragraph
  - text: Высота обелиска — 67 метров
  - paragraph
  - heading "Атмосферные кварталы Буэнос-Айреса" [level=3]
  - paragraph: "Ла-Бока. Портовый район Буэнос-Айреса, который вырос вокруг старой гавани. В 19–20 веках сюда приезжали иммигранты, часто без больших денег и с надеждой на новую жизнь. В плотной застройке и смешении культур появилось танго, а район получил творческую репутацию: здесь работали художники, музыканты и уличные артисты."
  - paragraph: Самая известная улица района — Каминито. Она выглядит как яркая декорация к фильму. Здесь можно увидеть множество старых разноцветных домов и посмотреть выступления танцоров прямо на улицах.
  - paragraph
  - blockquote:
    - paragraph: "Каминито в Ла-Бока — это яркость, краски, история, танго, культурное пространство и визуальный символ Буэнос-Айреса. При этом сам район Ла-Бока лучше не посещать вечером и ночью, он не самый благополучный: суровый и рабочий."
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - img "Здания"
  - paragraph
  - text: "Район Каминито стал цветным благодаря художнику Бенито Кинкела Мартин. Не желая мириться с серостью вокруг, он выкрасил свой дом разноцветными квадратами. Потом к этой затее присоединились соседи. Фото: Анна Тихая"
  - paragraph
  - img "Улица"
  - paragraph
  - text: "На улицах Каминито много деталей, которые интересно разглядывать. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Сан-Тельмо — исторический район рядом с центром Буэнос-Айреса. В 19 веке часть жителей уехала отсюда из-за эпидемии жёлтой лихорадки, поэтому многие здания долго пустовали и их не реставрировали. Сегодня здесь много старинной архитектуры, мощёные улицы и антикварные лавки.
  - paragraph
  - blockquote:
    - paragraph: Это самый старый жилой квартал столицы, один из немногих, где город до сих пор помнит себя колониальным. Когда-то здесь жили богачи, но потом их роскошные поместья превратились в большие коммунальные квартиры, куда селились бедные иммигранты. Здесь узкие улицы с булыжной мостовой, старые фонари, книжные лавки, бары, которые не меняли интерьер десятилетиями, и дома с облупившейся штукатуркой, за которой скрывается история города.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - img "Улица"
  - paragraph
  - text: В 60-е и 70-е годы это место было богемным районом, где работали мастерские художников и джаз-клубы
  - paragraph
  - paragraph
  - paragraph: Реколета. Район с дорогой недвижимостью, популярный у обеспеченных пенсионеров и состоятельных путешественников. Здесь много архитектуры в европейском стиле, дорогих отелей и апартаментов.
  - paragraph: "Раньше здесь жила монастырская община аскетов-францисканцев: в 1732 году они построили церковь и кладбище при ней. А в середине 19 века, когда Буэнос-Айрес переживал эпидемию жёлтой лихорадки, сюда бежала местная аристократия. Так окраина стала частью столицы и одним из самых дорогих и престижных районов."
  - paragraph
  - img "Здания"
  - paragraph
  - text: "О Реколете часто говорят как о латиноамериканском Париже. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: На местном кладбище хоронили представителей богатых семейств, президентов, учёных, военных и культурных деятелей. Теперь здесь множество роскошных склепов и надгробий, часто проводят экскурсии. Гиды рассказывают об архитектуре и людях, похороненных там. Есть бесплатные экскурсии на испанском языке.
  - paragraph: "На что обратить внимание:"
  - list:
    - listitem: Могила Евы Перон — первой леди Аргентины, которую считают символом заботы о бедных и рабочих. Её тело оказалось в семейном склепе лишь спустя 20 лет после смерти из-за политических конфликтов.
    - listitem: Могила Карлоса Пеллегрини — президента Аргентины, который помог стране выйти из тяжёлого экономического кризиса конца 19 века.
    - listitem: Могила Федерико Лелуара — нобелевского лауреата по биохимии. Его усыпальница считается самой дорогой на кладбище.
  - paragraph: Кладбище открыто ежедневно с 9:00 до 17:00. Вход стоит около 21 000 ARS, оплачивается картой, наличными оплатить нельзя.
  - paragraph: У входа можно взять карту.
  - paragraph
  - img "Здания"
  - paragraph
  - text: "Гробницы президента Хулио Рока и нобелевского лауреата Луиса Лелуара. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%B9%D0%BB:Recoleta_100.jpg
  - paragraph
  - paragraph
  - paragraph: Пуэрто-Мадеро. Современный район Буэнос-Айреса. В конце 19 века здесь находился порт, куда приходили грузовые корабли. В 1990-х старые доки отреставрировали, склады снесли, а на их месте появились офисные башни, жилые апартаменты и длинная набережная.
  - paragraph: Главный символ района — мост Женщины. Одна из его частей поворачивается, чтобы пропускать суда.
  - paragraph
  - img "Мост"
  - paragraph
  - text: "Мост спроектировал испанский архитектор Сантьяго Калатрава. Фото: Анна Тихая"
  - paragraph
  - heading "Парки и зелёные зоны" [level=3]
  - paragraph: Экопарк — самый известный парк с животными в Буэнос-Айресе. Раньше на его месте был расположен зоопарк, но в 2016 году его решили преобразовать и не держать животных в клетках. Часть из них перевезли в заповедники, а тех, кто нуждался в реабилитации или не мог быть выпущен в дикую природу, оставили в парке. Сейчас там по-прежнему живут жирафы, павлины, фламинго и другие птицы и животные.
  - paragraph: На территории парка тоже есть постройки конца 19 — начала 20 века. Раньше в них располагались вольеры и клетки. А теперь их используют для выставок и образовательных мероприятий.
  - paragraph
  - img "Животные"
  - paragraph
  - text: "В парке живут патагонские мары. Это необычное животное встречается только в Аргентине. Его часто описывают как нечто среднее между зайцем и косулей. На самом деле это крупный грызун. Фото: Анна Тихая"
  - paragraph
  - img "Животные"
  - paragraph
  - text: "Гуляя по парку, можно встретить жирафов. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Парк Трес-де-Фебреро. Здесь находятся несколько озёр, беговые дорожки и зоны для пикников. Работает прокат лодок и катамаранов, есть планетарий «Галилео Галилей». Внутри планетария — зал с 20-метровым куполом, где показывают фильмы про космос, и музей с интерактивными экспонатами. Можно посмотреть макеты планет, спутников и телескопов.
  - paragraph: "На территории Трес-де-Фебреро также расположен большой парк роз, которому больше 100 лет. Он появился в 1914 году по инициативе мэра Хоакина Анчорены. Тогда в саду высадили 14 650 кустов роз 1189 сортов. Спустя почти сто лет после открытия парк получил мировое признание: в 2012 и 2014 годах ему присудили награду от Всемирной федерации обществ роз."
  - paragraph
  - img "Гуси"
  - paragraph
  - text: "В парке Трес-де-Фебреро живут гуси. Фото: Анна Тихая"
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Планетарий на берегу озера красиво подсвечивается вечером. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%93%D0%B0%D0%BB%D0%B8%D0%BB%D0%B5%D0%BE_%D0%93%D0%B0%D0%BB%D0%B8%D0%BB%D0%B5%D0%B9_(%D0%BF%D0%BB%D0%B0%D0%BD%D0%B5%D1%82%D0%B0%D1%80%D0%B8%D0%B9)#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Planetario_de_la_Ciudad_de_Buenos_Aires.jpg
  - paragraph
  - paragraph
  - paragraph: Японский сад — один из крупнейших за пределами Японии. Его открыли в 1967 году в честь визита в Аргентину наследного принца Японии Акихито и принцессы Митико. Проект задумали как символ дружбы между двумя странами.
  - paragraph: На территории есть пруды с карпами кои, мосты и красивые аллеи. Также работают японский культурный центр, где проходят выставки и мероприятия, ресторан с традиционной кухней, оранжерея с коллекцией бонсай и сувенирный магазин.
  - paragraph: "Ботанический сад Карлоса Тайса. Большой городской парк-музей растений, который открыли в 1898 году. Его создал французский ландшафтный дизайнер Карлос Тайс. Сегодня в саду больше 5 тысяч видов растений, три стилистические зоны: итальянская, французская и восточная. Также там установлены десятки скульптур 19–20 веков: копии античных статуй, фигуры богов, учёных."
  - paragraph:
    - text: Больше достопримечательностей страны →
    - link "Что посмотреть в Аргентине":
      - /url: https://youtravel.me/blog/strany/6-best-places-to-visit-in-argentina
  - paragraph
  - img "Пруд"
  - paragraph
  - text: "Парк действительно похож на те, что можно встретить в Японии. Фото:"
  - link "flickr.com":
    - /url: https://flickr.com/photos/atapress/49530857868/in/photolist-6bRXBe-2isSAq5-wwNdh-6bW3EL-6bRXBB-8XetNR-SUFiD9-wwN3b-SUFhdd-8cW4pf-8cSJYc-8cW5gy-qycsNg-2isVoh9-SyErgJ-3RPJqi-3QZmAo-3RTpAL-3QEYGm-8cSKQv-4snH1h-2g4ka43-4W7ZQY-T9xkrH-5pWXCj
  - paragraph
  - heading "Культурные центры и музеи" [level=3]
  - paragraph: Культурный центр КиКи (Centro Cultural Kirchner) открыли в 2015 году в здании бывшего главпочтамта и назвали в честь президента Нестора Киршнера. Там устраивают выставки аргентинских художников и спектакли, а также есть пространства, где люди танцуют, поют и играют на инструментах сами. Если хочется поближе познакомиться с творческим досугом аргентинцев, стоит сходить.
  - paragraph: Одна из главных достопримечательностей центра — симфонический зал La Ballena Azul («Голубой кит»), где устраивают концерты. Там три этажа и 1750 мест, стоит орган немецкой фирмы Klais Orgelbau. Это один из самых больших и технически сложных органов в Южной Америке.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Здание, в котором сейчас находится культурный центр, открыли в 1928 году. Фото:"
  - link "wikimedia.org":
    - /url: https://commons.wikimedia.org/wiki/File:Buenos_Aires_Centrum_Kirchner.jpg
  - paragraph
  - img "Зал"
  - paragraph
  - text: "Интерьер симфонического зала. Фото:"
  - link "wikimedia.org":
    - /url: https://commons.wikimedia.org/wiki/File:Interior_sala_sinf%C3%B3nica_CCK.jpg
  - paragraph
  - paragraph
  - paragraph: Танго Портеньо (Tango Porteño) — одно из самых известных мест в Буэнос-Айресе, где устраивают танго-шоу. На сцену выходят более 25 танцоров, живой оркестр и вокалисты. Есть билеты только на шоу и варианты с напитками или ужином.
  - paragraph: Шоу проходит в здании на месте легендарного театра Metro, открытого в 1937 году. Когда-то здесь шли громкие премьеры аргентинского и мирового кино и проходили гламурные вечера. Зал отреставрировали, сохранив атмосферу 1940-х.

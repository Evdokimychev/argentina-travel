  - paragraph
  - heading "Безопасность" [level=3]
  - paragraph: В Аргентине распространены мелкие кражи, особенно в туристических местах Буэнос-Айреса. Местные жители советуют не ходить с телефоном в руке и не носить его в карманах, а убирать в сумку. Чтобы не потерять свою основную российскую сим-карту, можно взять телефон для улицы, с которым не жалко расстаться.
  - paragraph
  - blockquote:
    - paragraph: В целом Буэнос-Айрес — достаточно безопасный город, это не Колумбия и не Рио-де-Жанейро, где могут убить за кошелёк или телефон. Но там много карманников, как и во многих больших туристических городах. Крепко держите сумки — их могут сорвать на мопеде, не светите телефоном в людных местах, не кладите его на стол в кафе. В общем, соблюдайте стандартные меры безопасности.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - heading "Жильё" [level=3]
  - paragraph: Жильё можно забронировать на Airbnb или Booking, воспользоваться российскими сервисами, такими как «Островок» и OneTwoTrip, или поискать варианты на местных сайтах — Zonaprop и Argenprop.
  - paragraph: В Буэнос-Айресе много старинных квартир во французском стиле с высокими потолками, лепниной, паркетом и балкончиками с витыми оградками. В Реколете или Палермо можно пожить в такой необычной атмосфере.
  - paragraph
  - blockquote:
    - paragraph: Самые популярные районы для туристов, где безопасно и приятно жить, — Реколета, Бельграно, Палермо и Палермо Сохо. В этих кварталах преимущественно европейская архитектура, тихие улочки, чисто и красиво. В Микроцентро, Сан-Тельмо и Монсеррат более оживлённо и шумно, но много ресторанов и магазинов. В Ретиро, Ла Боке и Сан-Николас путешественники останавливаться не рекомендуют, я поддержу. Эти районы более опасные и отдалённые.
    - text: Анна, путешественница месяц прожила в Буэнос-Айресе
  - paragraph
  - paragraph
  - paragraph
  - img "Здания"
  - paragraph
  - text: "Архитектура разных районов Буэнос-Айреса очень отличается. Фото: Анна Тихая"
  - paragraph
  - heading "Транспорт" [level=3]
  - paragraph: Буэнос-Айрес — отличный город для пешеходов. Там очень много широких проспектов, почти везде можно идти в тени деревьев. Также удобно передвигаться на такси, метро или автобусе — коллективо (colectivos).
  - paragraph
  - blockquote:
    - paragraph: Удобнее всего использовать сервисом «Убер», но надо быть готовым, что такси не приедет через 5 минут, иногда приходится ждать долго. Дешевле ездить на общественном транспорте. В городе удобное и недорогое метро и развитая сеть автобусных маршрутов. Для поездок надо заранее купить карту SUBE в аэропорту или киосках. Пополнить её можно наличными на станциях метро.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - img "Автобус"
  - paragraph
  - text: "Автобусы в Буэнос-Айресе выглядят ярко и необычно. По одной из версий, в начале 20 века владельцы грузовиков переделывали их под пассажирские перевозки и раскрашивали, чтобы выделиться в потоке. Эта традиция сохранилась до сих пор. Фото: Анна Тихая"
  - paragraph
  - img "Метро"
  - paragraph
  - text: Станция метро Bulnes украшена панно, посвящёнными аргентинской культуре и традициям
  - paragraph
  - heading "Деньги" [level=3]
  - paragraph: Национальная валюта Аргентины — песо (ARS). 1 ₽ равен примерно 20 ARS. Российские карты «Мир» не работают. Использовать карты других стран можно, но невыгодно. Лучше брать с собой наличные доллары и менять в точках обмена — cuevas. Курс там выгоднее того, что предлагают в банках.
  - paragraph: Снимать наличные с иностранных карт в местных банкоматах тоже невыгодно из-за высокой комиссии. Если у вас карта иностранного банка и нет наличных долларов, можно воспользоваться обменниками — в Буэнос-Айресе большое русское комьюнити и есть ребята, которые меняют рубли на песо и привозят их прямо вам домой. Главное — найти проверенные агентства.
  - paragraph
  - blockquote:
    - paragraph: Платить картой можно, но учитывайте, что в некоторых местах бывает комиссия 5–10% и курс не самый выгодный. Лучше всего везти наличные доллары — обязательно купюры по 100 $, новые и без единого пятнышка, и там менять на песо по хорошему курсу.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me

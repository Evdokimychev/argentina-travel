  - paragraph: Дворец Воды (Palacio de Aguas Corrientes). Здание 1894 года, которое построили как часть городской системы водоснабжения. Внутри — резервуары и трубы, но снаружи оно выглядит как дворец.
  - paragraph: На втором этаже расположен музей. Там собрана крупнейшая в Южной Америке коллекция сантехнических объектов, включая одну из самых больших на континенте подборок унитазов и едва ли не энциклопедию того, как менялась бытовая гигиена в Аргентине. Музей прославился и масштабом коллекции, и тем, что для такой темы нашлось место в одном из самых красивых зданий города.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Проект резервуара разработало английское инженерное бюро Джона Бейтмана, а внешний архитектурный облик — норвежский архитектор Олаф Бойе. В 1989 году здание объявили Национальным историческим памятником. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BB%D0%B0%D1%81%D0%B8%D0%BE_%D0%B4%D0%B5_%D0%90%D0%B3%D1%83%D0%B0%D1%81_%D0%9A%D0%BE%D1%80%D1%80%D0%B8%D0%B5%D0%BD%D1%82%D0%B5%D1%81#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Aguas_Corrientes-2011-TM.jpg
  - paragraph
  - paragraph
  - paragraph: Национальный музей изящных искусств появился в 1896 году, а в 1933 году переехал в своё нынешнее здание — бывшую водонапорную и насосную станцию. Сегодня это главный художественный музей страны с коллекцией аргентинского и европейского искусства.
  - paragraph: В музее представлены картины, скульптуры и гравюры. Есть работы Рембрандта, Рубенса, Ренуара, Сезанна, Шагала и Пикассо. Из аргентинских художников представлены Кандидо Лопес, Лино Энеа Спилимберго, Хуль Солар.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "За 130 лет в музее появилась коллекция более чем из 13 000 произведений разных эпох. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%B9%D0%BB:Museo_Nacional_de_Bellas_Artes_%2812407%29.jpg
  - paragraph
  - paragraph
  - paragraph: "Музей латиноамериканского искусства, MALBA. Там хранится коллекция более чем из 400 произведений искусства: живопись, скульптура, фотография и графика ведущих латиноамериканских художников. Есть работы Фриды Кало, Диего Риверы и Гильермо Куитки."
  - paragraph
  - img "Музей"
  - paragraph
  - text: "Здание музея построили в 1997 году. Проект выбрали по итогам международного архитектурного конкурса. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Театр «Колон» — оперный театр, существующий с 1908 года. Его назвали в честь Христофора Колумба — по-испански Cristóbal Colón. Здесь выступали легенды оперы и балета, в том числе Анна Павлова и Лучано Паваротти. Попасть в театр можно не только во время постановок, но и с экскурсией. Внутри очень красиво.
  - paragraph: В районе Ла-Бока есть музей, где хранятся подлинные сценические декорации, костюмы и другие элементы оформления мировых спектаклей, которые ставили на сцене театра «Колон».
  - paragraph
  - img "Фойе"
  - paragraph
  - text: "Фойе театра «Колон». Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9A%D0%BE%D0%BB%D0%BE%D0%BD_%28%D1%82%D0%B5%D0%B0%D1%82%D1%80%29#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Salon_dorado_del_Teatro_Col%C3%B3n.jpg
  - paragraph
  - img "Музей"
  - paragraph
  - text: "Экспозиция в музее декораций театра. Фото: Анна Тихая"
  - paragraph
  - heading "Места для шопинга" [level=3]
  - paragraph: "Авенида Санта-Фе. Самая крупная торговая улица Буэнос-Айреса: тут много магазинов одежды, обуви, косметики, книжных и торговых центров."
  - paragraph: "Ярмарка Реколета. Рынок рядом с кладбищем, который работает по выходным. Это место, где можно собрать аргентинский старт-пак сувениров: украшения из местных камней, кожаные изделия, мате-чашки, постеры."
  - paragraph: «Галерея Пасифико» (Galerías Pacífico) — один из самых красивых торговых центров Буэнос-Айреса, который появился в 1889 году. Сначала здесь работали магазины Bon Marché, а позже здание выкупила железная дорога Buenos Aires al Pacífico — отсюда и появилось название.
  - paragraph: Главное, ради чего сюда заходят, — купол с муралами аргентинских художников 20 века. Здесь же работает культурный центр Борхеса — пространство для культурных событий, выставок и выступлений. А также есть несколько кафе, где можно посидеть, выпить кофе и ещё раз поднять голову к куполу, потому что с первого раза рассмотреть всё невозможно.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Фрески художника Антонио Берни на куполе. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Улица Каминито в Ла-Боке. На этой яркой улице продают много сувениров. Можно купить футболки, шарфы, магниты, украшения, а также картины местных художников.
  - paragraph: "Улица Дефенса в районе Сан-Тельмо. По воскресеньям здесь проходит большая ярмарка: вдоль всей улицы выстраиваются сотни лавок с украшениями, керамикой, постерами, винтажом. Рядом находится крытый рынок, где продают еду, сладости, сувениры."
  - paragraph
  - blockquote:
    - paragraph: "Мы оказались на этой улице случайно, пока искали рынок Сан-Тельмо. Нас сразу окружила толпа: это было необычно, потому что все остальные улицы центра города по воскресеньям выглядят заброшенными и пустыми. На улице Дефенса оказалось всё иначе: длинная ярмарка с товарами исключительно ручной работы, танцоры танго, музыканты и другие артисты. Мы провели там часа полтора и, конечно, не ушли без подарков себе и друзьям. А ещё рядом есть уютный семейный ресторан Espiritu Bohemio — обязательно загляните!"
    - text: Анна, путешественница месяц прожила в Буэнос-Айресе
  - paragraph
  - paragraph
  - paragraph
  - img "Улица"
  - paragraph
  - text: "Атмосфера на улице Дефенса в воскресенье. Фото: Анна Тихая"
  - paragraph
  - heading "Интересные здания" [level=3]
  - paragraph: "Паласио Бароло. Офисный небоскрёб 1923 года на Авенида-де-Майо. Когда его открыли, он был самым высоким зданием в Буэнос-Айресе и во всей Южной Америке. Проектировали с размахом и большими амбициями: у здания 22 этажа и 9 лифтов — роскошь для 1920-х. На куполе находится башня-маяк. Его включают до сих пор 25 числа каждого месяца: он светит в небо полчаса."
  - paragraph: Здание построил итальянец Марио Паланти по заказу бизнесмена Луиса Бароло. Он хотел занять первые три этажа, а остальное сдавать в аренду. Офисы в этом здании работают до сих пор. Но также здание стало национальным историческим памятником.
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Высота здания — около 100 метров. Фото:"
  - link "wikimedia.org":
    - /url: https://commons.wikimedia.org/wiki/File:Palacio_Barolo_visto_de_frente.jpg
  - paragraph
  - paragraph
  - paragraph: "Дворец Конгресса. Главный парламентский символ Аргентины. В архитектуре много интересных деталей: крылатые львы, химеры, короны и статуи, которые любят рассматривать путешественники."
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Здание построили в 1906 году как резиденцию Национального конгресса Аргентины. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%B9%D0%BB:Palacio_del_Congreso_in_Buenos_Aires_%286370115601%29.jpg
  - paragraph
  - paragraph
  - paragraph: «Эль Атенео» (El Ateneo Grand Splendid). Книжный магазин, который занял здание бывшего театра. Он работал здесь с 1919 года, потом пространство переделали под кинотеатр, а в 2000 году новый владелец открыл там магазин. The Guardian назвал его одним из самых красивых книжных в мире.
  - paragraph: Прежний интерьер сохранили. Остались фрески, театральный свет. Книги здесь стоят прямо в театральных ложах и на балконе, а на старой сцене работает кафе.
  - paragraph
  - img "Театр"
  - paragraph
  - text: "На потолке — фрески итальянского художника Назарено Орланди. Фото: Анна Тихая"
  - paragraph
  - link "Танго, футбол, эмпанадас":
    - /url: https://youtravel.me/tours/location/buenos-ayres
    - img "Танго, футбол, эмпанадас"
  - paragraph
  - heading "Другие интересные места" [level=3]
  - paragraph: Кроме необычных зданий, парков и кварталов, в Буэнос-Айресе есть ещё много мест, которые стоит посмотреть. Вот некоторые из них.
  - paragraph: Стадион «Ла Бомбонера» — домашняя арена футбольного клуба «Бока Хуниорс». Внутри работает музей клуба, где собраны трофеи и архивные фотографии игроков. Прозвище La Bombonera, то есть «шоколадная коробка», стадион получил из-за необычной формы.
  - paragraph: "Торре Монументаль — 75-метровая часовая башня. Построена в 1916 году на деньги британской общины к столетию Майской революции. Изначально она называлась Торре-де-лос-Инглесес. Почти все материалы для башни привезли из Великобритании: портлендский камень, английский кирпич, часы."
  - paragraph
  - paragraph
  - img "Стадион"
  - paragraph
  - text: "Стадион построен с крутыми трибунами, находящимися близко к полю. Фото:"
  - link "wikipedia.org":
    - /url: https://en.wikipedia.org/wiki/La_Bombonera#/media/File:Vista_a%C3%A9rea_del_Estadio_Alberto_J._Armando_%22La_Bombonera%22_01.jpg
  - paragraph
  - img "Здание"
  - paragraph
  - text: "Внутри башни есть винтовая лестница и лифт, установленный в 20 веке. Фото:"
  - link "wikimedia.org":
    - /url: https://commons.wikimedia.org/wiki/File:Torre_Monumental_-_2.jpg
  - paragraph
  - paragraph
  - paragraph: Флорис Генерика — гигантский металлический цветок, который создал аргентинский архитектор Эдуардо Каталано в 2002 году. Главная особенность скульптуры — подвижные лепестки. Утром они раскрываются, а вечером закрываются. За движение отвечает электрический механизм, который реагирует не только на время, но и на погоду — при сильном ветре цветок закрывается. А по ночам, когда лепестки закрыты, внутри скульптуры горит свет.
  - paragraph
  - img "Скульптура"
  - paragraph
  - text: "Высота цветка в сложенном виде — около 23 метров, а ширина — 16 метров. Когда лепестки раскрываются, цветок разрастается до 32 метров в ширину. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph
  - blockquote:
    - paragraph: Я провела в Буэнос-Айресе почти весь январь. По моим ощущениям, отдельные достопримечательности в этом городе — это его рестораны и кофейни. Обязательно изучайте заведения в вашем районе, от себя могу посоветовать кафе The Food Truck Store, Tabac Coffee, La Rambla, Clorindo Cafe Brunch в районе Реколета и Kraft Coffee Deli, Meme Coffee, Gramo cafe, Ser y Tiempo, Campobravo в Палермо. Если захочется русской кухни, загляните в Ivan Juan и Chaijana.
    - text: Анна, путешественница месяц прожила в Буэнос-Айресе
  - paragraph
  - paragraph
  - paragraph
  - heading "Что привезти из Буэнос-Айреса" [level=2]
  - paragraph: Сладости. Можно взять с собой десерт дульсе де лече или купить альфахорес — печенье из двух половинок с начинкой из дульсе де лече или джема. Каждый день в Аргентине съедают около 6 млн альфахорес. Велика вероятность, что к моменту вылета из Буэнос-Айреса вы будете зависимы от них не меньше, чем местные.
  - paragraph
  - img "Кофе и десерт"
  - paragraph
  - text: "Аппетитное печенье альфахорес идеально сочетается с кофе. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: "Предметы для чаепития мате. Можно купить те самые чаши с металлическими трубочками бомбилья. Традиционно чаши делают из высушенной тыквы, но сегодня они бывают из самых разных материалов: дерева, керамики, стекла и пластика, с разнообразным дизайном."
  - paragraph
  - img "Стаканы"
  - paragraph
  - text: "Аксессуары для мате. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Кувшин-пингвин. Много десятилетий назад аргентинцы придумали разливать вино из кувшина в форме пингвина. Самой распространённой тарой для перевозки и хранения вина тогда были дамаджуаны — огромные стеклянные бутыли, часто вмещавшие более 20 литров. Но когда нужно было подать вино гостям, требовался сосуд поменьше. Почему его сделали именно в форме пингвина, неясно. По одной из версий, через «клюв» вино легко наливалось и выглядел кувшин симпатично. В 60–70-х такие кувшины были во многих аргентинских заведениях и домах. Сегодня их тоже можно встретить в кафе и купить на рынках и в магазинах.
  - paragraph
  - img "Кувшины"
  - paragraph
  - text: В заведениях вино чаще подают в белых кувшинах, но встречаются и цветные
  - paragraph
  - paragraph
  - paragraph: Футбольные аксессуары. За кого бы вы ни решили болеть, если во время поездки вам удастся попасть на матч, наверняка захочется увезти с собой сувенир на память о команде, за которую вы переживали. В магазинах при стадионах, а также по всему городу продаются футболки местных клубов. Главное — не надевайте её, если собираетесь на стадион команды-соперника.
  - paragraph
  - img "Фанаты"
  - paragraph
  - text: Футбольная атрибутика очень популярна в Аргентине. В магазинах и на рынках легко найти футболки, шарфы, флаги
  - heading "Вам может понравиться" [level=2]

  - text: собрала гайд по городу Буэнос-Айрес — столица Аргентины и самый крупный город страны. Здесь живут футболом и танго, сочными стейками и дешёвым вином. Рассказываем, что интересного посмотреть в Буэнос-Айресе и как спланировать поездку.
  - group: "Путеводитель по столице Аргентины:"
  - paragraph
  - 'heading "Буэнос-Айрес: главное, что надо знать" [level=2]'
  - heading "Когда ехать" [level=3]
  - paragraph: Аргентина находится в Южном полушарии, поэтому времена года отличаются от привычных нам. Когда в России зима, там лето — и наоборот. Летом температура нередко поднимается выше +30 °C, особенно в январе и феврале. Зимой в среднем около +18 °C, а самым холодным месяцем считается июль.
  - paragraph
  - blockquote:
    - paragraph: Советую лететь в Аргентину осенью или весной — это лучшие сезоны. Тогда будет комфортно посетить не только Буэнос-Айрес, но и другие регионы страны. На юг в Патагонию лучше всего ехать, когда там не слишком холодно. Примерно с октября по апрель. А если хотите включить в поездку север страны и посмотреть соляные пустыни, пемзовые поля и вулканы, учтите, что с декабря по февраль там будет жарковато.
    - link "DMITRY KARMANOV тревел-эксперт YouTravel.me":
      - /url: /expert/283424/dmitry
      - img
      - text: DMITRY KARMANOV тревел-эксперт YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - img "Улица"
  - paragraph
  - text: Когда у нас осень, в Аргентине — весна. Там расцветают фиолетовые деревья хакаранда
  - paragraph
  - heading "Как добраться" [level=3]
  - paragraph: Прямых рейсов из России в Буэнос-Айрес нет. Обычно летят из Москвы с двумя остановками. Например, первая пересадка в Стамбуле или Аддис-Абебе, вторая — короткая техническая остановка в Сан-Паулу. Билеты туда-обратно обойдутся минимум в 120 000 ₽.
  - paragraph
  - heading "Виза, загранпаспорт и другие документы" [level=3]
  - paragraph: Россияне могут находиться в Аргентине без визы до 90 дней. Можно въехать и выехать несколько раз. Главное — чтобы в течение полугода общий срок пребывания не превысил 90 дней.
  - paragraph: "Вам понадобятся:"
  - list:
    - listitem: загранпаспорт, действующий как минимум 6 месяцев с момента въезда в страну;
    - listitem: обратные билеты и подтверждённая бронь жилья — их часто спрашивают на границе;
    - listitem: медицинская страховка на весь период пребывания в стране — без неё тоже могут не пустить.

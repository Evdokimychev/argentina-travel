  - paragraph
  - 'heading "Советы: когда ехать, что взять с собой" [level=2]'
  - paragraph: "Когда ехать. С ноября по март — сезон дождей: водопады наиболее полноводные, но может быть жара до +35 °C и высокая влажность. В этот период на водопадах много туристов — особенно в декабре — феврале."
  - paragraph: С апреля по октябрь — меньше дождей, комфортная температура +20…+28 °C. С июня по август самый спокойный период — поток посетителей снижается.
  - paragraph: Если хотите увидеть водопады в их максимальной мощности — приезжайте с ноября по март. Если важнее спокойные прогулки без толп путешественников — лучше планировать путешествие с июня по август.
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Бурые потоки воды приносит сезон дождей, это фото сделано в ноябре. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Где лучше останавливаться. В Пуэрто-Игуасу больше атмосферных экоотелей и бюджетных хостелов. Отличный вариант — Gran Meliá Iguazú, отель с видом на водопады прямо из окна.
  - paragraph: В Фоз-ду-Игуасу тоже широкий выбор отелей — от бюджетных до люксовых. Популярный Belmond Hotel das Cataratas расположен прямо у входа в парк.
  - paragraph: Также в обеих странах можно найти апартаменты с кухней и несколькими комнатами на Airbnb и Booking.com.
  - paragraph: "Что взять с собой:"
  - list:
    - listitem: Удобную закрытую обувь — кроссовки или лёгкие трекинговые ботинки, тропы скользкие.
    - listitem: "Водоотталкивающую куртку или лёгкий дождевик: погода постоянно меняется, часто во второй половине дня возможен дождь."
    - listitem: Солнцезащитный крем, панаму или шляпу с широкими полями, солнцезащитные очки. Средства от комаров — насекомых у водопадов и в парке птиц много.
    - listitem: Сменную одежду — вы можете промокнуть, особенно на тропах возле водопадов и во время прогулок на лодке.
    - listitem: Водонепроницаемые мешочки для телефона и документов.
    - listitem: Перекус и воду. На территории парков не очень много ресторанов и кафе, а маршруты длинные.
  - paragraph
  - img "Девушки на фоне водопада"
  - paragraph
  - text: "Фото с моста в Глотке Дьявола. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph
  - blockquote:
    - paragraph: "Я брала с собой на водопады дождевик. Думаю, что это бессмысленно: если вы хотите пройти по мосту рядом с Глоткой Дьявола (на бразильской стороне), дождевик вас не спасёт. Порывы ветра орошают с ног до головы, дождевик сдувает, лицо и волосы всё равно намокают. С моста мокрые выходили абсолютно все. Вместо дождевика лучше взять сменную одежду. Если день жаркий, а вы в натуральной и лёгкой одежде, то быстро высохнете сами. Если идти по мосту не планируете, дождевик не пригодится — на тропах бриз не такой сильный."
    - text: Анна путешественница и редактор YouTravel.me
  - paragraph
  - paragraph
  - paragraph: Билеты в парк можно купить онлайн, но это не обеспечит быстрое прохождение. Лучше взять специальный билет с возможностью проходить вне очереди — это сэкономит вам два-три часа и силы на прогулку.
  - paragraph: "Время посещения национальных парков. Начинайте день как можно раньше: утром меньше людей, прохладнее, лучше освещение для фото. После полудня много воды, брызги и туман, что затрудняет обзор."
  - paragraph: Закладывайте на поездку к водопадам минимум два дня. Если хотите осмотреться в городах с аргентинской или бразильской стороны, посетить местные достопримечательности и закупиться в Парагвае, лучше запланировать три-четыре дня на поездку.
  - paragraph:
    - text: В Южной Америке ещё много достопримечательностей, которые стоит увидеть хотя бы раз в жизни. Если не хотите самостоятельно планировать такое путешествие, посмотрите
    - link "туры от экспертов YouTravel.me":
      - /url: https://youtravel.me/tours/continent/южная_америка
    - text: . Среди них — восхождения на Мачу Пикчу, погружение в загадочную культуру Боливии и танцы на бразильском карнавале в 2026 году.

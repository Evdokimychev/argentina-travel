  - paragraph
  - heading "Аргентина" [level=2]
  - paragraph: "Аргентинская сторона — самый насыщенный по впечатлениям маршрут. Около 80% каскадов находятся именно здесь. Главный недостаток — панорама водопадов отсюда видна не полностью. Зато путешественники буквально оказываются внутри водопадной системы: сеть металлических мостиков и троп проходит над рекой, вдоль каскадов и по самой кромке обрыва."
  - paragraph: "Аргентинская сторона парка большая: чтобы увидеть всё, обычно нужно не меньше пяти-шести часов. Стоимость посещения национального парка Iguazú — от 45 $ (3600 ₽)."
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Один из десятков боковых каскадов аргентинской стороны: вода стекает по тёмным базальтовым уступам, образуя несколько уровней мелких потоков. Фото:"
  - link "Евгений, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/2331/%D0%B5%D0%B2%D0%B3%D0%B5%D0%BD%D0%B8%D0%B9
  - paragraph
  - heading "Инфраструктура и маршруты парка" [level=3]
  - paragraph: Инфраструктура почти полностью сосредоточена у входной зоны. После того как вы проходите кассы, попадаете в просторный приветственный павильон с большим рестораном, несколькими кафе, сувенирными магазинами и стойками информации. Здесь же находятся камеры хранения и туалеты.
  - paragraph: По всей территории есть указатели и информационные щиты, а на многих участках маршрутов стоят сотрудники парка, которые следят за безопасностью и подсказывают направление.
  - paragraph
  - img "Карта"
  - paragraph
  - text: "Карта национального парка на аргентинской стороне. Фото:"
  - link "iguazufalls.com":
    - /url: http://iguazufalls.com
  - paragraph
  - paragraph
  - paragraph: "Маршруты парка. В парке по кольцевому маршруту курсирует экологический поезд. Он делает три остановки: Estación Central у входа, Estación Cataratas в середине территории и Estación Garganta del Diablo у начала главного маршрута к Глотке Дьявола. Поезд включён в стоимость билета и ходит каждые 15–20 минут."
  - paragraph: Станция Estación Cataratas — главная отправная точка для двух больших пеших маршрутов — Верхней и Нижней тропы. Маршруты не пересекаются и проходят по замкнутым петлям, которые возвращают посетителей обратно к станции.
  - paragraph: "Верхняя тропа проходит по мосткам над вершинами каскадов. Это самая простая тропа в парке: дорожка ровная, без крутых подъёмов, с широкими платформами для фото. По пути видно, как вода переливается через край обрывов и уходит вниз. Длина тропы — 1,7 км, время прохождения — час-полтора."
  - paragraph: Нижняя тропа проходит ближе к подножию водопадов. Там больше ступеней, а брызги ощущаются сильнее. По пути открываются виды на несколько крупных каскадов и можно подойти ближе к воде, чем наверху. Маршрут длиннее и физически сложнее верхнего, но доступен большинству туристов. Его длина — 1,4 км, а время прохождения — полтора-два часа.
  - paragraph
  - img "Поезд"
  - paragraph
  - text: "Экологический поезд в национальном парке Игуасу — основной транспорт внутри аргентинской стороны, который довозит посетителей к началу всех пеших маршрутов. Фото:"
  - link "wikipedia.org":
    - /url: https://en.wikipedia.org/wiki/File:Tren_ecol%C3%B3gico_de_la_Selva_Parque_Nacional_Iguaz%C3%BA.JPG
  - paragraph
  - paragraph
  - paragraph: От станции поезда Estación Garganta del Diablo начинается самый популярный маршрут — длинная система металлических мостков, которые проходят прямо над рекой Игуасу. Дорожка тянется чуть больше километра и ведёт к большой смотровой площадке над Глоткой Дьявола — самым мощным каскадом всего комплекса.
  - paragraph: "Маршрут полностью ровный, без подъёмов, но открытый: солнце и брызги ощущаются сильно. На дорогу стоит закладывать от одного до полутора часов."
  - paragraph: "В парке есть ещё одна тропа — Sendero Macuco. Она не связана с сетью станций поезда. Вход на неё расположен примерно в километре от входной зоны парка, вдоль главной асфальтовой дороги. Маршрут проходит в глубь джунглей и ведёт к небольшому водопаду Arrechea, у которого разрешено купаться. Тропа полностью дикая: здесь нет мостков, кафе или туалетов, а указатели встречаются реже. Путь туда-обратно занимает два-три часа. На Sendero Macuco меньше туристов: большинство путешественников остаётся на основных маршрутах."
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Каскады аргентинской стороны: здесь водопады образуют почти непрерывную стену воды, которую можно рассмотреть с десятков ракурсов благодаря разветвлённой сети настилов и троп. Фото:"
  - link "Евгений, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/2331/%D0%B5%D0%B2%D0%B3%D0%B5%D0%BD%D0%B8%D0%B9
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Нижняя тропа аргентинской стороны выводит к настилам прямо над водой — отсюда лучше всего видно мощь боковых каскадов и туман от Глотки Дьявола. Фото:"
  - link "Евгений, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/2331/%D0%B5%D0%B2%D0%B3%D0%B5%D0%BD%D0%B8%D0%B9
  - paragraph
  - heading "Экскурсии парка" [level=3]
  - paragraph: Помимо прогулок по тропам национального парка, есть развлечение — экскурсия Gran Aventura. Сначала вы проезжаете около восьми километров сквозь джунгли на открытом внедорожнике, затем пересаживаетесь на катер, который идёт по реке к подножию водопадов. Моторные лодки подходят вплотную к потокам воды, и за несколько секунд пассажиры оказываются полностью мокрыми.
  - paragraph: "Поездка занимает 30 минут и стоит 52 $ (4000 ₽). Купить билет можно на официальном сайте организатора или в национальном парке. В высокий сезон туры часто распродаются: ближайший доступный слот может быть через несколько часов, поэтому покупать билеты лучше заранее."
  - paragraph: Другая активность — ночные прогулки при полной луне Paseos de Luna Llena. Парк открывают в конце рабочего дня для ограниченного числа посетителей пять ночей в месяц. Группы едут на экопоезде до тропы, ведущей к Глотке Дьявола, и идут по пешеходным мостикам в темноте при лунном свете без дневной жары и тумана от брызг — ночью воздух холоднее, поэтому брызги не поднимаются высоко. Прогулка занимает два часа и стоит 63 $ (5000 ₽).
  - paragraph: Купить билет можно на сайте организатора или в национальном парке. Делать это стоит заранее — количество мест обычно ограничено.
  - paragraph
  - img "Водопад и лодка"
  - paragraph
  - text: "Прогулка на катере по нижнему течению Игуасу: с воды хорошо видно боковые каскады, которые не попадают в пешие маршруты парка"
  - paragraph
  - heading "Чем заняться в округе" [level=3]
  - paragraph: В самом городе Пуэрто-Игуасу есть обзорная площадка Hito Tres Fronteras — точка, где сходятся границы Аргентины, Бразилии и Парагвая и где хорошо видно слияние рек Игуасу и Парана.
  - paragraph: Если у вас целый день, его можно посвятить поездке к иезуитским руинам San Ignacio Miní — они внесены в список Всемирного наследия ЮНЕСКО. Это однодневная экскурсия на расстояние примерно 240–270 километров от Пуэрто-Игуасу.
  - paragraph: Путешественники часто посещают обе страны, чтобы увидеть водопады со всех сторон. Между аргентинским Пуэрто-Игуасу и бразильским Фоз-ду-Игуасу курсируют автобусы Rio Uruguay с остановкой на границе. Путь занимает около получаса, но нужно закладывать время на паспортный контроль. Стоимость билета — около 4 $ (400 ₽).
  - paragraph
  - img "Река и лес"
  - paragraph
  - text: "Вид на место слияния рек Игуасу и Парана — здесь сходятся границы Аргентины, Бразилии и Парагвая. С каждой стороны расположены смотровые площадки. Фото:"
  - link "wikipedia.org":
    - /url: https://en.wikipedia.org/wiki/File:Tripla_Fronteira._Paraguai,_Brasil_e_Arxentina.jpg
  - paragraph
  - heading "Как добраться" [level=3]
  - paragraph: Классический путь на аргентинскую сторону начинается в Буэнос-Айресе — столице Аргентины. Отсюда удобнее всего долететь до города Пуэрто-Игуасу. Перелёт занимает примерно полтора-два часа, а билет в одну сторону стоит от 70 $ (5600 ₽). Дешёвая альтернатива — автобус. Рейсы ходят несколько раз в день, дорога занимает 16–20 часов, а билет стоит от 47 $ (3800 ₽).

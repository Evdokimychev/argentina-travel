  - link "Смотреть туры":
    - /url: "https://youtravel.me/tours/country/аргентина "
  - paragraph: "Город Пуэрто-Игуасу находится в 17–20 км от входа в аргентинский национальный парк. Между городом и парком весь день курсируют автобусы: они отправляются от автовокзала каждые 15–20 минут, путь занимает около получаса. Цена поездки — 5,5 $ (400 ₽), билеты можно купить в автобусном терминале."
  - paragraph: Другой вариант добраться до парка — на такси за 15–20 $ (1200–1600 ₽).
  - paragraph
  - img "Дом"
  - paragraph
  - text: "Здание таможенного поста в Пуэрто-Игуасу, построенное в 1942 году. Сейчас это объект историко-культурного наследия и офис Федеральной налоговой службы Аргентины. Фото:"
  - link "wikimedia.org":
    - /url: https://commons.wikimedia.org/wiki/File:Edificio_de_la_antigua_aduana_de_Iguazu.jpg
  - paragraph
  - heading "Бразилия" [level=2]
  - paragraph: "Бразильская сторона — лучший выбор для тех, кто хочет увидеть Игуасу целиком. Здесь открывается цельная панорама всей U-образной линии водопадов, растянутой почти на три километра. В отличие от Аргентины, маршруты короче и проще: основная тропа занимает около двух часов спокойной прогулки. Стоимость входа в национальный парк Iguaçu — от 23 $ (1800 ₽)."
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Игуасу состоит из 275 отдельных каскадов. Их форма меняется после каждого сильного сезона дождей: часть уступов размывает потоками и карта водопада каждый год выглядит немного по-другому. Фото:"
  - link "Илья, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/245452/%D0%B8%D0%BB%D1%8C%D1%8F
  - paragraph
  - heading "Инфраструктура и маршруты парка" [level=3]
  - paragraph: "Инфраструктура в бразильском парке тоже сосредоточена у входа: в визит-центре работают кассы, камеры хранения, туалеты, несколько кафе и фудкорт с горячими блюдами и закусками, есть сувенирные магазины, автоматы с водой и аптечный киоск. Там можно купить дождевики, крем от солнца и защиту для техники — всё, что пригодится на маршруте."
  - paragraph: После прохода через вход в глубине парка удобств меньше, но на ключевых точках установлены туалеты, есть киоски с водой и напитками, а также небольшие закусочные у смотровых площадок.
  - paragraph
  - img "Автобус и люди"
  - paragraph
  - text: "Двухчасовая очередь на билетный контроль и посадку в автобус. В очереди придётся стоять, даже если у вас куплены билеты онлайн. Фото: Анна Тихая"
  - paragraph
  - img "Карта"
  - paragraph
  - text: "Карта национального парка на бразильской стороне. Фото:"
  - link "iguazufalls.com":
    - /url: https://iguazufalls.com/wp-content/uploads/iguazu-falls-brazilian-side-map.png
  - paragraph
  - paragraph
  - paragraph: Маршруты парка. В парке есть основная дорога длиной 11,6 км. По ней можно пройти, проехать на своём или арендованном в визит-центре велосипеде и на автобусе. Автобусный маршрут начинается после визит-центра. Автобусы идут последовательно через несколько остановок. Посетители выходят на нужной остановке, проходят выбранный маршрут и затем садятся на другой автобус, который следует дальше по линии.
  - paragraph: Первая по пути остановка — Park’s Office Stop. Рядом начинается лесная тропа Circuito São João. Она ведёт в глубь леса и выводит к нескольким природным бассейнам, где разрешено купаться. Маршрут проходит по грунтовой дорожке, занимает около часа в одну сторону и включён в стоимость билета.
  - paragraph: Следующая остановка — Poço Preto Trail Stop. Отсюда начинаются два маршрута. Первый — длинная тропа Caminho do Poço Preto — девятикилометровый трек по лесу, который можно пройти или проехать на велосипеде. Он занимает до четырёх часов туда-обратно. Второй — Trilha da Canafístula. Это лесная тропа длиной 2,2 км, доступная как для пеших прогулок, так и для поездок на велосипеде. Дорожка проходит по участку Атлантического леса, где легко встретить птиц, бабочек и мелких животных.
  - paragraph
  - img "Люди"
  - paragraph
  - text: "Вид из окна автобуса на пути к водопадам. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: После этого автобус делает отдельную остановку у центра Macuco Safari. Это экскурсия, в которую входят проезд по джунглям на электрокаре и прогулка на скоростной лодке, подходящей почти под струи водопадов. В стоимость основного билета такая экскурсия не входит. На этой же остановке — вход на Caminho das Bananeiras, спокойную тропу длиной 1,3 км вдоль тихого участка реки. Трек заканчивается у деревянного настила с видом на воду и подходит тем, кто хочет короткую прогулку вдали от большого потока туристов.
  - paragraph: "Завершающая остановка — The Path of the Falls Stop, вход на главную панорамную тропу Trilha das Cataratas. Это основной маршрут бразильской стороны: около полутора километров оборудованных мостков, которые тянутся вдоль края каньона и открывают панораму почти всех каскадов аргентинской стороны. Тропа заканчивается у платформы с мостками над рекой, откуда видна Глотка Дьявола снизу."
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "На протяжении всего маршрута вы будете видеть водопады — они тянутся по правую сторону, если вы идёте к Глотке Дьявола. Фото: Анна Тихая"
  - paragraph
  - img "Тропы"
  - paragraph
  - text: "Тропы ухоженные и аккуратные, кое-где есть ступеньки. Ближе к водопаду поверхность влажная, поэтому идти лучше в кроссовках или удобных сандалиях. Фото: Анна Тихая"
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "На водопадах есть естественные бассейны между каскадами, но купаться в Игуасу строго запрещено — из-за сильного течения и нестабильных уступов. Фото:"
  - link "Илья, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/245452/%D0%B8%D0%BB%D1%8C%D1%8F
  - paragraph
  - heading "Экскурсии парка" [level=3]
  - paragraph: В национальном парке основной маршрут по тропе можно дополнить Macuco Safari — это программа, которая объединяет проезд по джунглям на электрокаре и сплав по реке Игуасу к подножию водопадов. Поездка занимает полтора-два часа и стоит 147 $ (12 000 ₽).
  - paragraph: "От бразильской стороны стартуют и вертолётные туры: десятиминутный полёт выполняют над всем амфитеатром водопадов. Цена билета для четверых человек — 2300 $ (180 000 ₽)."
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "К Глотке Дьявола подплывать небезопасно, поэтому лодка курсирует по более спокойной части реки, но эмоции всё равно будут яркие. Фото: Анна Тихая"
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Панорама водопадов из вертолёта на бразильской стороне. Фото:"
  - link "Андрей, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/68507/%D0%B0%D0%BD%D0%B4%D1%80%D0%B5%D0%B9
  - paragraph
  - heading "Чем заняться в округе" [level=3]
  - paragraph: Преимущество бразильской стороны — рядом с водопадами Игуасу больше интересных достопримечательностей, чем в Аргентине.
  - paragraph
  - link "Туры в Южную Америку":
    - /url: https://youtravel.me/tours/continent/южная_америка
    - img "Туры в Южную Америку"
  - paragraph
  - paragraph: "Недалеко от входа в бразильский парк находится парк птиц Parque das Aves — крупнейший в Латинской Америке реабилитационный центр для тропических птиц. Его основали супруги-орнитологи, когда впервые спасли семейство птиц, пострадавших от браконьеров. Сейчас здесь живёт более 140 видов — среди них туканы, разноцветные попугаи ара, розовые фламинго, совы. Большую часть обитателей конфисковали у незаконных торговцев или нашли раненными в лесу: о спасённых птицах заботятся и даже разводят редкие виды, которые находятся на грани исчезновения. Ещё в парке есть вольеры с бабочками и рептилии."
  - paragraph: Посетители гуляют по большим вольерам, где птицы летают свободно, и могут наблюдать за кормлением, уходом и работой сотрудников центра. На посещение обычно уходит 1–3 часа, билет стоит 16 $ (1250 ₽). Часто поход в парк совмещают с визитом на водопады.
  - paragraph
  - blockquote:
    - paragraph: Многие путешественники совмещают посещение водопадов с парком птиц, потому что они находятся рядом. Мы тоже хотели так сделать, но после пяти часов на водопадах вернулись в отель очень уставшие — грохот воды, утомительная очередь и жаркий день сделали своё дело. Решили съездить к птицам на следующий день. Это идеальный вариант, если позволяет время. Парк птиц — занятие не на один час. Он не очень большой, но за пернатыми хочется подольше понаблюдать, всех хочется сфотографировать, а в чудесном саду у фонтана в начале парка — выпить кофе с десертом.
    - text: Анна путешественница и редактор YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - img "Птица"
  - paragraph
  - text: "Это тукан — его можно встретить и в городской среде, но в парке получится рассмотреть очень близко. Фото: Анна Тихая"
  - paragraph
  - img "Птицы"
  - paragraph
  - text: "Почти на всей территории посетители гуляют прямо среди птиц. В парке много служащих, которые следят, чтобы обитателей не трогали и не кормили. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Также в городе можно посетить плотину Итайпу — это одна из крупнейших в мире ГЭС. Итайпу обеспечивает почти 90% электроэнергии в Парагвае и около 15% — в Бразилии. Если на станции случится поломка, практически весь Парагвай останется без электричества.
  - paragraph: "Масштабы плотины впечатляют: её длина почти 8 километров, а резервуар занимает территорию больше, чем некоторые европейские города. ГЭС настолько мощная, что в год способна производить больше 100 млрд кв/ч электроэнергии — если в среднем современный атомный реактор производит за год 6–8 млрд, то плотина работает как 15 атомных реакторов одновременно."
  - paragraph: Экскурсии по станции проходят на автобусах компании, с остановками на смотровых площадках и доступом к экспозиции в визит-центре. Экскурсия стоит от 5 $ (400 ₽) и занимает два-три часа.
  - paragraph
  - img "Плотина"
  - paragraph
  - text: "Водосброс на плотине Итайпу — впечатляющее зрелище. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%98%D1%82%D0%B0%D0%B9%D0%BF%D1%83#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Itaipu2.JPG
  - paragraph
  - paragraph
  - paragraph: Ещё одно популярное место — Триграница (Marco das Três Fronteiras), точка, где сходятся Бразилия, Аргентина и Парагвай. На территории есть смотровая площадка с видом на слияние рек Игуасу и Парана, тематические павильоны, кафе и небольшая экспозиция, посвящённая истории и культуре гуарани.
  - paragraph: Каждый вечер здесь проходит представление с традиционными танцами и музыкой трёх стран. Для входа на территорию нужен билет — купить можно онлайн и на месте. Цена — 11 $ (800 ₽). Посещение занимает час-два, особенно если приходить к закату и оставаться на вечернее шоу.
  - paragraph
  - img "Указатель"
  - paragraph
  - text: "Указатель на Тригранице — популярной смотровой площадке на стыке Аргентины, Бразилии и Парагвая. Фото:"
  - link "wikimedia.org":
    - /url: https://commons.wikimedia.org/wiki/File:Placas_-_Marco_das_Tr%C3%AAs_Fronteiras.jpg
  - paragraph
  - img "Смотровая площадка и реки"
  - paragraph
  - text: Вид на место слияния рек Игуасу и Парана — точку, где сходятся три границы. Слева за зелёным берегом находится Аргентина; прямо через реку — Парагвай; а сама смотровая площадка расположена на бразильской стороне
  - paragraph
  - paragraph
  - paragraph: Через реку Парана Фоз-ду-Игуасу соединён с Парагваем мостом Дружбы (Ponte da Amizade) — пограничным переходом между двумя странами. По мосту постоянно ходят пешеходы, мотоциклисты и автобусы, а движение там — одно из самых оживлённых в регионе.
  - paragraph: На другой стороне моста расположен Сьюдад-дель-Эсте — крупнейший торговый город Парагвая. Это свободная экономическая зона, поэтому здесь много магазинов электроники, косметики и бытовой техники с более низкими ценами, чем в Бразилии. Туристы часто приезжают сюда на несколько часов ради шопинга или просто чтобы увидеть контраст между странами.
  - paragraph: Переход через мост обычно занимает 15–30 минут, но в часы пик могут быть очереди. Для посещения Сьюдад-дель-Эсте достаточно иметь при себе загранпаспорт, виза гражданам России не требуется.
  - paragraph
  - img "Мост"
  - paragraph
  - text: "Вид на мост Дружбы между Парагваем и Бразилией со стороны Бразилии. На мосту всегда пробка, но перейти его можно и пешком — главное, возьмите паспорт, если придётся отмечаться на границе. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: В Фоз-ду-Игуасу находится Blue Park — крупный водный комплекс, построенный вокруг естественного термального источника. В парке есть бассейн с искусственными волнами и пляжем, закрытые и открытые горки, зона с горками для детей и расслабляющая термальная лагуна. Посещение займёт три-четыре часа. Билет для взрослого стоит от 50 $ (4000 ₽).
  - paragraph: Любовь к муралам и остальному уличному искусству — отличительная черта городов Латинской Америки, Бразилия не исключение. Например, в Фоз-ду-Игуасу вы увидите около 200 изображений одного и того же кошачьего силуэта. На стенах, заборах, заброшенных домах — этот символ города стал узнаваем далеко за пределами Фоз-ду-Игуасу.
  - paragraph
  - img "Граффити"
  - paragraph
  - text: "Уличное искусство Бразилии. Фото: Анна Тихая"
  - paragraph
  - heading "Как добраться" [level=3]
  - paragraph: Для бразильской стороны отправная точка — город Фоз-ду-Игуасу. Здесь есть аэропорт, поэтому проще всего прилететь внутренним рейсом из Сан-Паулу или Рио-де-Жанейро. Билеты в одну сторону стоят от 83 $. Полёт из обоих городов занимает около двух часов.
  - paragraph: Добраться до Фоз-ду-Игуасу можно и автобусом — дорога из Рио-де-Жанейро занимает примерно 25 часов, а билет стоит от 60 $ (5000 ₽), из Сан-Паулу — около 16 часов и от 40 $ (3000 ₽).
  - paragraph
  - blockquote:
    - paragraph: Автобусы в Бразилии большие и комфортные, чаще всего с туалетами и водой — особенно на дальние расстояния. Если при покупке билета вы видите пометку Leito или Semi-Leito, у сиденья можно откинуть спинку кресла или поставить подножку. Такие кресла находятся на втором этаже. Если видите пометку Cama или Leito-Cama — эти кресла раскладываются практически на 180 градусов, как кровать. Они находятся на первом этаже в вип-зоне — там едет гораздо меньше людей, вам выдают снеки, плед и подушку. Стоят такие места в два раза дороже обычных.
    - text: Анна путешественница и редактор YouTravel.me
  - paragraph
  - paragraph
  - paragraph
  - img "Автобус"
  - paragraph
  - text: "Автобус из Флорианополиса в Фоз-ду-Игуасу, место Cama. Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: От Фоз-ду-Игуасу до входа в национальный парк удобнее всего добираться на местных автобусах или такси. От главного городского транспортного терминала Terminal de Transporte Urbano в Фоз-ду-Игуасу ходит автобусный маршрут № 120. Путь занимает 35–45 минут, а билет стоит примерно 1 $ (80 ₽). На такси будет быстрее, а поездка обойдётся около 6 $ (600 ₽). Аэропорт Фоз-ду-Игуасу находится близко ко входу в парк и между ними курсируют автобусы.
  - paragraph
  - img "Здания"
  - paragraph
  - text: "Фоз-ду-Игуасу — город, основанный ещё в 19 веке, но сегодня он выглядит современно: новые жилые кварталы и высокие здания соседствуют с зелёными парками и старой частью города. Фото:"
  - link "wikipedia.org":
    - /url: https://en.wikipedia.org/wiki/File:SkylineFoz.JPG

  - heading "Откуда лучше ехать на водопады" [level=2]
  - paragraph: Игуасу расположены на стыке двух стран — Аргентины и Бразилии. Отправиться к водопадам можно из любой. Для туристических путешествий виза россиянам не требуется в обоих государствах.

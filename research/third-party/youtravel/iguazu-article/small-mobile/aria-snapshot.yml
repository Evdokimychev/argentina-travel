  - img "Водопады Игуасу"
  - text: "5106 Читать 25 мин. 28 ноября 2025 Путеводитель по водопадам Игуасу: с какой стороны смотреть и чем ещё заняться в округе"
  - link "Татьяна фан Ройен":
    - /url: /blog-author/7708/татьяна
    - img "Татьяна фан Ройен"
  - link "Татьяна фан Ройен":
    - /url: /blog-author/7708/татьяна
  - text: "впечатлена красотой водопадов В джунглях на границе Аргентины и Бразилии река обрывается сотней каскадов, образуя один из самых впечатляющих природных амфитеатров мира — водопады Игуасу. Их часто сравнивают с Ниагарой, но они выше, а увидеть их можно очень близко: пройти по мосткам прямо над бурной рекой и вплотную подплыть на лодке к мощным струям. В статье разберёмся, в какой стране лучше всего любоваться Игуасу, как туда добраться и чем ещё заняться в округе."
  - group: "Что вы узнаете:"
  - paragraph
  - heading "Главное о водопадах Игуасу" [level=2]
  - paragraph: Водопады расположены на реке Игуасу, которая образует естественную границу между Бразилией и Аргентиной и частично проходит вдоль Парагвая. Комплекс включает 275 отдельных каскадов протяжённостью 2,7 км. Он расположен в пределах двух национальных парков — Iguaçu National Park в Бразилии и Iguazú National Park в Аргентине, оба занесены в список Всемирного наследия ЮНЕСКО.
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "Водопады выглядят завораживающе. В кино их можно увидеть в фильмах «Миссия» (1986), «Индиана Джонс и Королевство хрустального черепа» (2008) и «Чёрная пантера» (2018). Фото: Анна Тихая"
  - paragraph
  - paragraph
  - paragraph: Игуасу — это многоступенчатые обрывы с мощными потоками воды и живописными участками спокойной реки, уходящей в джунгли. Они возникли около 120 тысяч лет назад, когда из-за тектонических сдвигов река изменила русло и прорезала базальтовое плато. Водопады настолько впечатляющие и масштабные, что вошли в список новых семи чудес природы.
  - paragraph: "Главная достопримечательность — Глотка Дьявола (Garganta del Diablo): гигантская U-образная пропасть шириной 150 м и высотой 80 м, куда с оглушительным рёвом падает основной объём воды. Из-за огромного количества водных частиц в воздухе после дождя над Игуасу часто появляется двойная или даже тройная радуга."
  - paragraph
  - img "Водопад"
  - paragraph
  - text: "С бразильской стороны прямо по дну Дьявольской Чаши проходит пешеходный мост — это самый интересный участок тропы. Фото:"
  - link "Дмитрий, тревел-эксперт YouTravel.me":
    - /url: https://youtravel.me/expert/283424/dmitry
  - paragraph
  - paragraph
  - paragraph: "Название Игуасу происходит из языка гуарани: и — «вода», guasu — «большая». В местной мифологии есть легенда о прекрасной девушке Наипи, которую ревнивый бог-змей Мбой превратил в водопад, а её возлюбленного — в скалу. Считается, что бурлящая Глотка Дьявола — символ этого проклятия."
  - paragraph: "Интенсивность Игуасу заметно меняется в зависимости от сезона: с ноября по март, в период дождей, водопады особенно мощные — уровень воды поднимается, некоторые тропы могут временно закрывать из-за сильного течения. В сухой сезон, с апреля по октябрь, воды меньше. Зато каскады лучше различимы: туман почти не поднимается и видимость становится лучше. В этот период тропы обычно полностью открыты."

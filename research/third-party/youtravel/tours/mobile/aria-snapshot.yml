  - text: "В горах мы были впервые, поэтому наши сердца горы покорили 💕 Большое спасибо Гидам, которые возили нашу команду: Сослану, Чермену, Аслану. От каждого из них мы почерпнули частичку своих эмоций, каждый по-разному рассказывал и подарил нам совершенно разные впечатления от поездки. Конечно, выражаем благодарность организатору тура - Николая. Спасибо за продуманный маршрут и комфорт. Нам повезло с погодой, поэтому нам удалось увидеть все заявленные локации с прекрасными видами. Сам тур насыщенный, виды завораживают! Обязательно вернемся снова!"

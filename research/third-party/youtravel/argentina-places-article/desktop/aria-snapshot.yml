  - heading "Полезное о стране" [level=2]
  - paragraph: "Аргентина поражает контрастами: можно побывать одновременно в джунглях и на ледниках, посетить самую южную точку в мире и даже отправиться отсюда к берегам Антарктиды. Ещё Аргентина очень большая: путешественники чаще всего перемещаются между регионами на самолёте. Самое дорогое — это перелёты в Аргентину и по стране. А самое приятное — всё остальное."
  - paragraph: "Климат. Лучшее время путешествий в Аргентину — с декабря по февраль. В эти месяцы комфортно посещать одновременно север и юг страны. На севере, в Буэнос-Айресе, в этом время 23–28 °С, а на самом юге в Ушуайе 9–13 °С. Ещё в Аргентине часто бывают перепады температур: например, сегодня температура может быть 30 °С, а завтра опуститься до 6 °С."

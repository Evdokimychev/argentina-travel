  - heading "Обелиск" [level=3]
  - paragraph: Народный монумент Аргентины. Он стоит посреди самой широкой улицы в мире — Авенида 9 де Хулио, её ширина 110 метров. Обелиск построили в 1936 году, в честь 400-летия со дня основания столицы. Здесь впервые был вывешен аргентинский флаг.
  - paragraph: "Изначально постройка не понравилась местным жителям из-за конусообразной формы: были даже митинги за снос монумента. Со временем аргентинские жители к нему привыкли, и в итоге он стал народным символом. У футбольных фанатов даже есть традиция: в случае победы они приходят праздновать её именно сюда."
  - paragraph: "Обелиск стоит на площади Республики. Вечером он смотрится особенно красиво: вдоль всей конструкции зажигается яркая подсветка."
  - paragraph
  - img "обелиск и здания"
  - paragraph
  - text: "Высота обелиска — 67 метров, это как 25-этажный дом. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9E%D0%B1%D0%B5%D0%BB%D0%B8%D1%81%D0%BA_%D0%B2_%D0%91%D1%83%D1%8D%D0%BD%D0%BE%D1%81-%D0%90%D0%B9%D1%80%D0%B5%D1%81%D0%B5#/media/%D0%A4%D0%B0%D0%B9%D0%BB:ObeliscoBA2015.2.jpg

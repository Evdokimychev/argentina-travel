  - 'heading "Восточное побережье: Мар-дель-Плата и другие города" [level=3]'
  - paragraph: "Атлантическое побережье Аргентины — длинная береговая линия от пригородов Буэнос-Айреса до патагонской Чубути. Сюда едут за тремя разными вещами: пляжным отдыхом, пингвинами и китами."
  - paragraph: "Мар-дель-Плата. Главный пляжный курорт страны, расположенный примерно в 400 км от Буэнос-Айреса. Аргентинцы называют его «пляжем» Буэнос-Айреса: сюда съезжается весь столичный средний класс в январе и феврале. Кроме пляжей здесь есть большой рыбный рынок, казино и уютный старый город с архитектурой начала XX века. Добраться из Буэнос-Айреса легко: автобус или машина около 4 часов."
  - paragraph
  - img "Пляж"
  - paragraph
  - text: "Аргентинцы, которые могут себе позволить поездки за границу, однако, на курортный отдых едут в соседнюю Бразилию — там пляжи, пальмы и более расслабленная атмосфера. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/Мар-дель-Плата#/media/Файл:Mar_del_Plata_beach.jpg
  - paragraph
  - paragraph
  - paragraph: Пуэрто-Мадрин. Небольшой курортный город в патагонской провинции Чубут. Он очень популярен для летнего отдыха на песчаных пляжах, но в основном сюда приезжают ради поездок к китам на полуостров Вальдес и к магеллановым пингвинам в Пунта-Томбо.
  - paragraph: Пунта-Томбо. Заповедник в 170 км к югу от Пуэрто-Мадрина. Каждый год с сентября по начало апреля здесь обитает колония магеллановых пингвинов, насчитывающая около 1,5 миллиона особей. По территории проложены специальные тропы, и птицы гуляют буквально вокруг вас — пугливыми их не назовёшь. Это самое большое скопление магеллановых пингвинов на континенте.
  - paragraph: Удобнее всего сочетать Пуэрто-Мадрин с полуостровом Вальдес — взять машину напрокат и объехать оба места за 2–3 дня.
  - paragraph
  - heading "Что посмотреть в Патагонии" [level=2]
  - paragraph: Патагония — это район на юге Аргентины. Он расположен на границе Чили и Аргентины, а с юга на север через регион протянулись горы Анды. Здесь прохладный климат, сильные ветры и редкая растительность. В то же время это фантастические ледники, заснеженные пики гор и кристально бирюзовые озёра. Расскажем о главных локациях крупнейшего региона Аргентины.
  - paragraph
  - heading "Город Ушуайя" [level=3]
  - paragraph: "Ушуайя в прямом смысле находится на краю света: это самый южный город в мире. Расположен на Огненной Земле Аргентины — архипелаге из 40 тыс. островов между Атлантическим и Тихим океанами. Из порта Ушуайи отплывают полярные экспедиции в Антарктиду."
  - paragraph: "На край света прилетают ощутить северную природу Аргентины: увидеть и покорить гигантские ледники, насладиться пейзажами тундровых лесов и горных пиков Анд. Всю эту красоту разом можно поймать в 11 км от Ушуайи — в национальном парке «Огненная Земля»."
  - paragraph: "Чтобы не запутаться: «Огненной землёй» одновременно называют архипелаг, провинцию Аргентины и национальный парк в Ушуайе."
  - paragraph
  - img "маяк, горы и море"
  - paragraph
  - text: На фото Лез Эклерер — самый южный маяк в мире. Стоит в 10 км от Ушуайи
  - paragraph
  - heading "Южное Патагонское ледниковое плато" [level=3]
  - paragraph: "Крупный горно-ледниковый комплекс на границе Аргентины и Чили. Патагонское плато огромное: с севера на юг оно протянулось на 350 км, а с востока на запад — на 90 км. Легендарные гигантские ледники находятся именно здесь."
  - paragraph: "На плато едут проникнуться красотой крайнего юга планеты: увидеть снежные фьорды Аргентины, ледники в озёрах Сан-Мартин и Лаго-Архентино, город Эль-Калафате и главный ледник Патагонии — Перито-Морено. Красотой ледников чаще всего наслаждаются с палубы катера или со смотровой площадки."
  - paragraph
  - img "девушка и ледник"
  - paragraph
  - text: Ради таких панорам на плато приезжают со всего мира
  - paragraph
  - heading "Ледник Перито-Морено" [level=3]
  - paragraph: Главная достопримечательность Патагонского плато находится в национальном парке Аргентины — «Лос-Гласьярес». Огромная стена ледяной массы своим видом вызывает трепет. Каждый день от ледника откалываются глыбы и с грохотом падают в воду.
  - paragraph: "Увидеть Перито-Морено можно несколькими способами: изучить его со смотровой площадки, пройти к нему по специальным дорожкам, доплыть на катере или совершить восхождение на поверхность."
  - paragraph
  - img "ледник"
  - paragraph
  - text: "Средняя высота Перито-Морено — 60 метров. Рядом оборудованы три смотровые площадки: делать фото оттуда очень удобно"
  - paragraph
  - img "яхта и ледник"
  - paragraph
  - text: "В составе туристической группы можно доплыть на комфортабельной яхте до Перито-Морено, взойти на его вершину и даже выпить виски со льдом из самого ледника. Фото: Андрей, тревел-эксперт YouTravel.me"
  - paragraph
  - heading "Эль-Калафате" [level=3]
  - paragraph: Небольшой город на краю света в окружении ледниковых скал с населением 6000 человек. Эль-Калафате как наша Териберка в Мурманской области — суровая окраина мира в окружении безмолвной природы. Путешественники едут сюда наслаждаться ледяными панорамами и покорять Перито-Морено.
  - paragraph: Помимо Перито-Морено, в Эль-Калафате есть и другие красивые ледники, например Спегаццини, Упсала и Пейнета. Можно заказать экскурсию и доплыть до них на катере.
  - paragraph: В Эль-Калафате все главные достопримечательности — природные. Например, здесь стоит посетить озеро Лаго Архентино — самое большое в Аргентине озеро площадью 1400 км2. Ещё можно подняться на гору Фицрой и насладиться восхитительными видами.
  - paragraph
  - img "горы, и тропинка вдоль побережье"
  - paragraph
  - text: Эль-Калафате — это не только ледники, но и вот такие пейзажи во время прогулок
  - paragraph
  - heading "Горы Фицрой и Серро-Торре" [level=3]
  - paragraph: "Одни из самых высоких гор в Аргентине. Высота горы Фицрой — 3405 метров, а Серро-Торре — 3102 метра. Находятся в провинции Санта-Крус, рядом с городом Эль-Чальтен. В районе гор путешественников встречают живописные виды северной природы Аргентины: укутанные снегом горы, лесные массивы и кристальная голубизна озёр. Рядом с Фицрой и Серро-Торре проложены туристические тропы и альпинистские маршруты."
  - paragraph: "В Эль-Чальтен есть смотровая площадка Лос Кондорес: с неё открывается один из лучших видов на пики горных хребтов. Чтобы попасть в горы, потребуется разрешение: его можно получить лично в Эль-Чальтен, оно выдаётся бесплатно."
  - paragraph: "Обе горы одинаково интересны путешественникам, но разница всё-таки есть: говорят, что подъём на Серро-Торре более сложный из-за крутизны перепадов — на неё чаще восходят те, кто любит бросить себе вызов. На гору Фицрой подниматься легче, хоть она и выше Серро-Торре на 303 метра."
  - paragraph
  - img "горы"
  - paragraph
  - text: "В районе горы очень переменчивый климат: иногда для восхождения на Фицрой альпинисты ждут подходящей погоды неделями. Неблагоприятные признаки: сильный ветер, дождь и снегопад"
  - paragraph
  - img "горы"
  - paragraph
  - text: Для восхождения выбирайте подходящую погоду. В районе горы Серро-Торре часто дуют сильные ветра, а вершина покрывается льдом — передвигаться по нему очень опасно
  - paragraph
  - heading "Пещера Куэва-де-лас-Манос" [level=3]
  - paragraph: "Уникальная древняя пещера в провинции Санта-Крус. Название переводится как «Пещера рук»: здесь найдены настенные рисунки множества человеческих рук возрастом от 9500 до 13000 лет."
  - paragraph: Помимо изображений рук, на стены наносили сцены охоты на страусов, гуанако и разных хищных животных. Также обнаружили рисунки болас — метательного оружия древних людей в Южной Америке. Пещера Куэва-де-лас-Манос — объект Всемирного наследия ЮНЕСКО.
  - paragraph
  - img "следы рук"
  - paragraph
  - text: "Интересно то, что на стенах оставлены следы левых рук, причём рук мальчиков-подростков. Предполагается, что пещера была священной: здесь мальчиков инициировали во взрослую жизнь. Актом перехода служил ритуал нанесения контура руки на стену. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D1%8D%D0%B2%D0%B0-%D0%B4%D0%B5-%D0%BB%D0%B0%D1%81-%D0%9C%D0%B0%D0%BD%D0%BE%D1%81#/media/%D0%A4%D0%B0%D0%B9%D0%BB:SantaCruz-CuevaManos-P2210651b.jpg
  - paragraph
  - img "скалы"
  - paragraph
  - text: "Вид из пещеры Куэва-де-лас-Манос. В ней жили потомки древних индейцев вплоть до 19 века, пока их не обнаружили поселенцы из Европы. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9A%D1%83%D1%8D%D0%B2%D0%B0-%D0%B4%D0%B5-%D0%BB%D0%B0%D1%81-%D0%9C%D0%B0%D0%BD%D0%BE%D1%81#/media/%D0%A4%D0%B0%D0%B9%D0%BB:SantaCruz-CuevaManos-P2210079b.jpg
  - paragraph
  - heading "Полуостров Вальдес" [level=3]
  - paragraph: "Вальдес расположен на востоке Аргентины в провинции Чубут, прямо на побережье Атлантического океана. Сюда приезжают посмотреть на экзотических животных Атлантики: пингвинов, китов, касаток, морских львов и тюленей. Путешественники любят объезжать полуостров на велосипеде и лошадях. Остановиться можно в Пуэрто-Мадрин и Трелью — ближайших крупных городах рядом с полуостровом Вальдес."
  - paragraph
  - img "кит"
  - paragraph
  - text: Наблюдение за китами на полуострове Вальдес — это целая индустрия. Можно добраться до скопления китов на лодке, посмотреть на них через иллюминатор на дне судна, поплавать с китами в обнимку и понаблюдать за ними под водой
  - paragraph
  - img "дорога и горы"
  - paragraph
  - heading "Какие вещи взять с собой" [level=2]
  - paragraph: Для поездки в Патагонию. Комфортные штаны, мембранная куртка, флисовая кофта, спортивный костюм, лёгкая шапка, шарф или баф, перчатки, гигиеническая помада.
  - paragraph: "Для походов и восхождений. Трекинговые ботинки или удобные кроссовки, небольшой походный рюкзак на 20–30 литров, термос. По желанию: трекинговые палки."
  - paragraph:
    - 'link "Как собрать чемодан в путешествие: 5 полезных вещей →"':
      - /url: https://youtravel.me/blog/layfkhaki-dlya-puteshestviy/kak-pravilno-sobirat-chemodan
  - paragraph: Для города. В Аргентине используются розетки нестандартного типа с косыми штырями, возьмите универсальный адаптер. Лучше сразу по приезде иметь наличные деньги — во многих местах в городе оплата наличными на 15-20% дешевле, чем картой.
  - paragraph: Если планируете передвигаться по стране на междугородних автобусах, возьмите маску для сна и беруши — пригодятся. Для поездок в центральную и северную часть пригодится жирный крем, климат там очень сухой. И, конечно, SPF — в любой сезон.
  - paragraph
  - heading "Советы гидов" [level=2]
  - paragraph:
    - text: Обмен валюты. Внимательно выбирайте обменники, потому что курс валюты может отличаться в несколько раз. Русские ребята из Аргентины сделали
    - link "сайт с картой обменников":
      - /url: https://cashar.pro
    - text: "по всей стране: к каждой точке обмена указаны адрес и время работы."
  - paragraph: Перелёты внутри страны. Заложите в бюджет расходы на авиабилеты от 500 до 700 $. Например, до водопадов Игуасу, городов Эль-Калафате и Ушуайя из Буэнос-Айреса комфортнее добраться на самолёте, а дорога на авто может занять более суток.
  - paragraph: Погода на маршруте. Посмотрите погоду в регионах Аргентины, которые планируете посетить. Например, в Ушуайя в декабре средняя температура 9 °С, а в июне 1 °С.
  - paragraph: "Сувениры. Из Аргентины можно привезти разукрашенный аргентинский горшочек: такие увидите на многих рынках Буэнос-Айреса. Девушкам можно подарить браслет, бусы или серьги из минерала родохрозит — «розы инков»."
  - paragraph: "Безопасность. В Аргентине высокий уровень преступности — в основном происходят кражи. Путешественники говорят, что чаще всего воруют в Буэнос-Айресе, а на юге страны это редкость. В столице могут вырвать из рук гаджет поздно вечером или на светофоре: лучше не держать в руках телефон постоянно. Если местные советуют не ходить в какие-то районы, стоит прислушаться."
  - paragraph
  - img "круглая кружка с травами"
  - paragraph
  - text: Лучшим подарком из Аргентины станет набор из матэ, калабаса и бомбильи. Матэ — это горячий напиток из высушенных листьев падуба, калабас — круглая кружка для заваривания, а бомбилья — трубочка, через которую пьётся матэ

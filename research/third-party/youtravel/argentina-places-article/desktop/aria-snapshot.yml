  - heading "Что ещё посмотреть в Аргентине" [level=2]
  - heading "Водопады Игуасу" [level=3]
  - paragraph: Главный природный памятник Латинской Америки. Находится в национальном парке «Игуасу» — объекте Всемирного наследия ЮНЕСКО. Здесь 275 шумящих водопадов с высотой падения воды 82 метра.
  - paragraph:
    - text: По одной из легенд, Бог влюбился в аборигенку по имени Наипу и решил на ней жениться. Но девушка сбежала на каноэ со своим возлюбленным. Бог в гневе разрезал реку, и появились водопады, которые обрекли влюблённую пару на вечное падение. Узнать больше про водопады →
    - 'link "Путеводитель по водопадам Игуасу: с какой стороны смотреть и чем ещё заняться в округе"':
      - /url: https://youtravel.me/blog/strany/vodopady-iguasu
  - paragraph
  - img "водопад"
  - paragraph
  - text: Так выглядят водопады Игуасу сверху
  - paragraph
  - img "водопад"
  - paragraph
  - text: Здесь оборудованы смотровые площадки с фантастическими панорамами на сотни громыхающих водопадов
  - paragraph
  - paragraph
  - paragraph: "Водопады Игуасу находятся на границе с Бразилией, но большая их часть расположена на территории Аргентины. Посетить водопады можно в обеих странах: между бразильской и аргентинской сторонами ездят регулярные автобусы."
  - paragraph: "К водопадам добираются тремя способами: по туристической тропе, на катере и вертолёте. На территории есть отели и кемпинги: при желании можно остаться на несколько дней и погулять, ощущая всю мощь диких южноамериканских джунглей. Водопады Игуасу находятся в провинции Мисьонес."
  - paragraph: "В поездку тревел-эксперты рекомендуют взять дождевик: у подножия водопадов брызги воды обильно летят во все стороны."
  - paragraph
  - img "водопад и вертолет"
  - paragraph
  - text: "Тревел-эксперты могут организовать такой полёт на вертолёте вокруг водопадов. Фото: Андрей, тревел-эксперт YouTravel.me"
  - paragraph
  - img "лодка и водопад"
  - paragraph
  - text: "В группе с другими путешественниками можно сплавать на катере к самому подножию водопадов. Фото: Андрей, тревел-эксперт YouTravel.me"

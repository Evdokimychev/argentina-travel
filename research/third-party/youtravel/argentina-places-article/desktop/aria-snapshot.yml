  - text: собрал лучше для своих амигос Лететь в Аргентину далеко, но путешествие на другой конец света того стоит. Сюда приезжают гулять по жаркому Буэнос-Айресу, летать на вертолёте над водопадами Игуасу, смотреть на легендарные ледники Патагонии и проникаться духом Латинской Америки.
  - paragraph
  - text: В статье покажем главные достопримечательности Буэнос-Айреса, Патагонии и других регионов Аргентины. А ещё расскажем, как добраться, что взять с собой в поездку и какие привезти сувениры.
  - paragraph: "Аргентина — это страстное танго и высокие Анды, нежный десерт Альфахорес, покоряющие сердца пингвины и дикие киты с полуострова Вальдес. После поездки каждому захочется признаться ей в любви, крикнув на испанском с трапа самолёта: «Тэ амо, моя Аргентина!»"
  - group: Буэнос-Айрес, Патагония и не только

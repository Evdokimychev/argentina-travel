  - heading "Национальный парк «Ибера»" [level=3]
  - paragraph: Ибера — это водно-болотная природная зона Аргентины. В 20 веке здесь было животноводческое ранчо, а в 1999 году это место купил частный фонд по защите природы. С тех пор животный и растительный мир территории находится под охраной.
  - paragraph: "В национальном парке произрастают 4000 видов растений, обитают 360 видов птиц и редких животных: среди них капибары, пампасные олени и красно-зелёные попугаи ара. По территории можно гулять пешком, ездить на автомобиле и даже верхом на коне. Также можно отправиться в сплав на лодке или заняться бёрдвотчингом."
  - paragraph: Бёрдвотчинг — любительское наблюдение за жизнью птиц через бинокль. Часто проходит в составе групповой экскурсии.
  - paragraph
  - img "реки"
  - paragraph
  - text: "Национальный парк «Ибера» расположен в провинции Корриентес, к северу от Буэнос-Айреса. Фото:"
  - link "wikipedia.org":
    - /url: https://en.wikipedia.org/wiki/Iber%C3%A1_National_Park#/media/File:Flying_Over_Esteros_del_Iber%C3%A1_The_kingdom_of_water,_North-eastern_Argentina.jpg
  - paragraph
  - heading "Пампасы" [level=3]
  - paragraph: "Природный регион в центральной части Аргентины. Бескрайние равнины и редкие деревья протянулись от Атлантического побережья до предгорья Анд. В Пампасах аргентинцы занимаются сельским хозяйством: пасут домашний скот и пашут землю под культурные посадки."
  - paragraph: Сюда приезжают кататься верхом по диким равнинам, смотреть на солончаки в парке Кампос-дель-Тую и гулять в живописном городе Сан-Антонио-де-Ареко среди пальм и цветущих садов. Стоит посетить город Тандил и попробовать там самое вкусное в Аргентине асадо — местное блюдо из жареного мяса.
  - paragraph: Солончак — это почва с большим содержанием соли. Её настолько много, что она выходит на поверхность земли. В результате образуются целые «соляные» долины — о самой «инопланетной» из них рассказываем в следующей главе.
  - paragraph
  - img "поля"
  - paragraph
  - text: "Пампасы — настоящая саванна в самом сердце континента. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BC%D0%BF%D0%B0#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Aut%C3%B3dromo_Eusebio_Marcilla.jpg
  - paragraph
  - img "парни на лошадях"
  - paragraph
  - text: "Эти парни — пастухи-гаучо из Сан-Антонио-де-Ареко. Пампасы — родина южноамериканских ковбоев Гаучо: в 19 веке они составляли основное население региона"
  - paragraph
  - heading "Провинция Сальта" [level=3]
  - paragraph: "Сальта — один из немногих аргентинских городов, который сохранил первозданный облик испанской колонии: узкие улочки, одноэтажные здания из охристого камня, площади с соборами и патио в тени апельсиновых деревьев."
  - paragraph: "Но Сальта интересна не только городом. Это ворота в один из самых неожиданных ландшафтов Аргентины: разноцветные каньоны долины Умауака, исполинские кактусы национального парка Лос-Кардонес, белоснежный солончак Салинас-Грандес и виноградники Кафайяте, которые дают самое высокогорное вино в мире. Отсюда же отправляется легендарный «Поезд в облака» — туристический маршрут, который поднимается на высоту более 4 000 метров, преодолевая 29 мостов и 13 виадуков по дороге к границе с Чили."
  - paragraph
  - blockquote:
    - paragraph: На Сальту однозначно стоит выделить время в путешествии по Аргентине. Оттуда возят на 4 основные экскурсии по провинции, плюс заложите пару дней на изучение самого города. Я бы рекомендовала на 5-7 дней приехать. Даже если не все экскурсии хотите брать, городок очень приятный и оживлённый в центре — там можно просто приятно провести время.
    - text: Анна путешественница. Провела в Сальте 3 дня
  - paragraph
  - paragraph
  - paragraph: Солончак Салинас-Грандес.Расположен в провинции Сальта, это почти крайний север страны.
  - paragraph: "Многие делают здесь «фото в облаках»: для этого нужно встать на поверхность солончака и сделать снимок в кристально чистом отражении его корки. Любопытные путешественники смогут рассмотреть строение солончака через вырезанные в почве прямоугольные лунки, которые делают местные жители для добычи соли и лития."
  - paragraph
  - img "Стеклянная гладь"
  - paragraph
  - text: "Стеклянная гладь солончака завораживает: создаётся ощущение, что прилетел на другую планету"
  - paragraph
  - paragraph
  - paragraph: Национальный парк «Лос-Кардонес». Площадь Лос-Кардонес составляет 650 км2 — это как вся Тюмень. Парк расположен на северо-западе Аргентины, в провинции Сальта.
  - paragraph: "Кругом пустынная местность, потому что в Лос-Кардонес очень засушливый климат. Территория напоминает Дикий Запад из американского кинематографа: кажется, что сейчас услышишь топот копыт и увидишь погоню во главе с шерифом."
  - paragraph
  - img "Кактусы"
  - paragraph
  - text: Лос-Кардонес — это горные хребты-сьерры, бесконечные сухие ущелья и сотни дикорастущих кактусов посреди безлюдной пустыни
  - paragraph
  - paragraph
  - paragraph: В Лос-Кардонес можно увидеть ископаемые останки вымерших животных и даже следы динозавров. А также полюбоваться тысячами кактусов на фоне гор, посетить археологический музей в деревне Качи и местные винодельни в районе города Кафайяте.
  - paragraph
  - img "Кактусы"
  - paragraph
  - text: Сюда стоит приехать, чтобы сфотографироваться с трёхметровым кактусом или гуанакой — их тут тоже много
  - paragraph
  - paragraph
  - paragraph: "Долина Умауака. Живописная долина длиной в 155 км с фантастическими видами разноцветных скал в провинции Жужуй. Здесь находится вековой памятник человечества Куапак-Ньян: караванная дорога времён инков, по которой шли товары в империю с севера континента. Долина принадлежит Всемирному наследию ЮНЕСКО."
  - paragraph: "В долину путешественники едут, чтобы увидеть невероятные пейзажи скал и погулять по нетронутым горным просторам Аргентины. Также стоит заехать в город Умауака: продегустировать индейскую кухню и аргентинские пирожки эмпанадас."
  - paragraph
  - img "Горы"
  - paragraph
  - text: Красочная палитра ущелья Умауака формировалась 75 миллионов лет
  - paragraph
  - heading "Провинция Мендоса" [level=3]
  - paragraph: "Живописная провинция в западной части Аргентины, на границе с Чили. Здесь возвышается гора Аконкагуа — самая высокая вершина Южной Америки. Местные называют регион Мендоса Городом солнца: летом здесь мало дождей и очень жарко, в среднем 30 °С. Регион знаменит виноделием, альпинизмом и горнолыжным отдыхом."
  - paragraph: "Здесь путешественники восходят на гору Аконкагуа: в регионе проложены пешеходные тропы и трекинговые маршруты разной сложности. Через Мендосу протекает одноимённая река: по ней можно сплавиться на рафте. В провинции стоит попробовать вино на местных винодельнях, увидеть Мост Инков и отдохнуть в Андах на горнолыжном курорте «Лас Леньяс»."
  - paragraph
  - img "горы"
  - paragraph
  - text: "Одна из живописных долин Мендоса. Впереди гора Аконкагуа: её высота 6961 метр"
  - paragraph
  - heading "Город Барилоче" [level=3]
  - paragraph: "Сан-Карлос-де-Барилоче, Озёрный край, южноамериканская Швейцария — город в провинции Рио-Негро называют по-разному. Красота Барилоче восхитительна: чистые озёра, снежные пики Анд и нетронутые леса."
  - paragraph: "В Барилоче можно подняться на смотровые площадки, попробовать местный шоколад, посетить кафедральный собор и городскую ратушу. За пределами Барилоче стоит увидеть главные озёра региона: Гутьерес, Науэль-Уапи, Маскарди и Морено. Ещё в Озёрный край приезжают отдыхать на горнолыжных курортах: их здесь минимум пять."
  - paragraph
  - img "леса, озеро и горы"
  - paragraph
  - text: Вот она — южноамериканская Швейцария
  - paragraph
  - heading "Национальный парк «Талампая»" [level=3]
  - paragraph: Талампая расположен в провинции Ла-Риоха. Его площадь 2150 км2 — это почти как Москва. В парке находятся ценные археологические достопримечательности. Например, высохшее русло реки, где когда-то жили динозавры. Талампая принадлежит Всемирному наследию ЮНЕСКО.
  - paragraph: "Здесь можно увидеть останки поселений древних племён, ботанический сад в одном из каньонов и местных животных: ламу гуанако, патагонского зайца мару, горную птицу кондора и лисицу чиллу."
  - paragraph
  - img "скалы"
  - paragraph
  - text: Высота каньонов в Талампая достигает 143 метров
  - paragraph
  - heading "Город Ла-Плата" [level=3]
  - paragraph: "Уютный город Аргентины с европейской готической архитектурой в провинции Буэнос-Айрес. Его называют Городом лип: в Ла-Плата растёт большое количество лип."
  - paragraph: "В Ла-Плата стоит посетить кафедральный собор: рассмотреть снаружи и внутри неоготическую архитектуру здания. Можно сфотографироваться на фоне национального университета Ла-Платы, одного из самых престижных в Аргентине."
  - paragraph: Известный выпускник университета — физик-ядерщик Роберт Оппенгеймер. В мире печально известен как создатель атомных бомб, сброшенных на Хиросиму и Нагасаки в 1945 году. Именно о нём снят фильм «Оппенгеймер», получивший главный «Оскар» в 2024 году.
  - paragraph
  - img "церковь в готическом стиле"
  - paragraph
  - text: "Кафедральный собор Ла-Платы является крупнейшей церковью Аргентины. Высота собора — 112 метров. Фото:"

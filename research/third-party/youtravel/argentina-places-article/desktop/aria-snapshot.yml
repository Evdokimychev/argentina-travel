  - paragraph: "Как добраться. Прямых рейсов из Москвы до Буэнос-Айреса нет. Лететь придётся с одной, двумя, иногда тремя пересадками — чаще всего в Катаре и Турции. Билеты весной2026 года стоят от 160 000 ₽ в обе стороны. Настраивайтесь на длительный перелёт: в пути проведёте пару дней."
  - paragraph:
    - link "Как купить дешёвые билеты на самолёт →":
      - /url: https://youtravel.me/blog/layfkhaki-dlya-puteshestviy/bilet-na-samolyet-po-tsene-obeda-rasskazyvaem-kak
  - paragraph: Часовой пояс. В Аргентине на 6 часов раньше, чем в Москве. Когда в Буэнос-Айресе 6:00, в Москве 12:00.
  - paragraph: Документы. В Аргентине можно находиться до 90 дней без визы в течение полугода. Важно, чтобы загранпаспорт действовал ещё 6 месяцев на момент въезда в страну. Перед поездкой нужно оформить медицинскую страховку. Также необходимы подтверждения брони отеля и обратного билета.
  - paragraph: Валюта. Официальная валюта — аргентинское песо, весной 2026 года 1000 песо ~ 55 ₽. Российские карты «Мир», «Виза» и «Мастер Кард» в Аргентине не работают, а карты «Юнион Пэй» — да.
  - paragraph
  - img "пляж, пальмы и небоскребы"
  - paragraph
  - text: "Отдых на пляжах в самом Буэнос-Айресе развит слабо. Зато красивые пляжи есть недалеко от столицы: самые лучшие расположены в городах Мар-дель-Плата, Сан-Бернардо-де-Туя и Мар-де-Ахо. Это примерно 4 часа дороги на авто"
  - paragraph
  - heading "Главные достопримечательности Буэнос-Айреса" [level=2]
  - heading "Район Ла-Бока" [level=3]
  - paragraph: Красочный район в юго-восточной части столицы. Сюда приезжают, чтобы увидеть разукрашенные дома знаменитого аргентинского квартала. А ещё узнать, кто и как создал историческую разрисовку района Ла-Бока.
  - paragraph: В 1896 году итальянские эмигранты усыновили мальчика Бенито Мартин, который в итоге стал самым дорогим аргентинским художником. Бенито Мартин вырос в Ла-Бока, очень любил квартал и в итоге решил встретить тут старость. Вернувшись на родину, он раскрасил свой дом квадратами разных цветов. Соседи вдохновились идеей, и Бенито Мартин начал бесплатно раздавать краску всем желающим при условии, что свои дома они окрасят так же. Так родился новый облик Ла-Бока.
  - paragraph: В Ла-Бока стоит прогуляться по самой известной улице Эль-Каминито. Здесь можно увидеть страстные танго-шоу, погулять среди ярких граффити и даже сделать фото с двойником Диего Марадона.
  - paragraph: Диего Марадона — легенда аргентинского футбола. Известен миру как автор яркого «Гола столетия» в 1986 году во время матча со сборной Англией.
  - paragraph
  - img "разноцветные здания"
  - paragraph
  - text: "Ла-Бока — самый криминальный район в столице. Но бояться не стоит: именно на улице Эль-Каминито безопасно, так как это многолюдное туристическое место. А вот сворачивать в другие переулки района путешественники не рекомендуют"

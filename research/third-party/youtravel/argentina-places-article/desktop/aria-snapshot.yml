  - heading "Дворец Национального конгресса Аргентины" [level=3]
  - paragraph: "В здании конгресса проходят заседания сенаторов и депутатов. Архитектура дворца собрала три элемента мировых памятников: крышу — от оперного театра в Париже, центральную вершину — от Бранденбургских ворот в Берлине, а форму здания — от Капитолия в Вашингтоне."
  - paragraph: "Будьте внимательны во время посещения достопримечательности: напротив здания иногда проходят митинги против различных законов и реформ. Забастовки — обычная часть жизни местных жителей, но она может неожиданно нарушить ваши планы."
  - paragraph
  - img "дворец"
  - paragraph
  - text: Попасть на экскурсию по дворцу можно только в составе группы. Записаться нужно в самом здании Конгресса
  - paragraph
  - heading "Кладбище и район Реколета" [level=3]
  - paragraph: Не самое популярное в других городах место среди туристов, кладбище — одна из главных достопримечательностей Буэнос-Айреса, которую включают в каждую обзорную экскурсию. Здесь покоятся бывшие президенты Аргентины, боевые генералы, художники. Самая известная могила Реколеты — склеп Эвы Перон, первой леди Аргентины.
  - paragraph: Колонны, ангелы и бронзовые скульптуры превратили некрополь в настоящий музей под открытым небом. Многие из могил объявлены национальными историческими памятниками Аргентины. Вход сюда платный, войти можно только с билетами и экскурсией.
  - paragraph
  - img "Кладбище"
  - paragraph
  - text: "Кладбище основали аскеты- францисканцы в 1732 году. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9A%D0%BB%D0%B0%D0%B4%D0%B1%D0%B8%D1%89%D0%B5_%D0%A0%D0%B5%D0%BA%D0%BE%D0%BB%D0%B5%D1%82%D0%B0#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Recoleta-tower-TM.jpg
  - paragraph
  - paragraph
  - paragraph: Сам район Реколета — один из лучших для прогулок в Буэнос-Айресе. Большинство домов здесь построены во французском стиле «шато»; именно благодаря Реколете Буэнос-Айрес называют Латиноамериканским Парижем. Прогуливаясь по улицам Альвеар, Кинтана и Аякучо, вы увидите посольства, роскошные отели и особняки в стиле французского боз-ар, итальянского палаццо и неоклассики.
  - paragraph
  - img "Улочки"
  - paragraph
  - text: Район Реколета очень зелёный — многочисленные скверы, площади и балконы, утопающие в цветах. Это также одно из самых безопасных и чистых мест во всём городе
  - paragraph
  - heading "Театр Колон" [level=3]
  - paragraph: "Колон входит в пятёрку лучших оперных театров мира, а в его зале — одна из лучших акустик планеты. Внутреннее убранство впечатляет: изящные резные узоры на балконах, фрески, оригинальные светильники. Золотой зал похож на дворец."
  - paragraph
  - img "Театр"
  - paragraph
  - text: "Театр построили в 1908 году и назвали в честь Христофора Колумба. Фото:"
  - link "wikipedia.org":
    - /url: https://ru.wikipedia.org/wiki/%D0%9A%D0%BE%D0%BB%D0%BE%D0%BD_(%D1%82%D0%B5%D0%B0%D1%82%D1%80)#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Salon_dorado_del_Teatro_Col%C3%B3n.jpg
  - paragraph
  - paragraph
  - paragraph: Помимо оперных спектаклей, здесь выступают инструментальные оркестры и балетные труппы. Каждый час в здании театра проходят экскурсии на нескольких языках — это единственный способ попасть внутрь для тех, кто не успел купить билет на спектакль.
  - paragraph
  - heading "Мост женщины и район Пуэрто-Мадеро" [level=3]
  - paragraph: Мост женщины — поворотный мост по проекту знаменитого испанского архитектора Сантьяго Калатравы. Это единственное сооружение Калатравы в Южной Америке. По замыслу автора, силуэт моста символизирует пару, танцующую танго.
  - paragraph
  - img "Мост"
  - paragraph
  - text: Своё название мост получил потому, что все улицы квартала носят имена выдающихся аргентинских женщин
  - paragraph
  - paragraph
  - paragraph: "Мост стоит в районе Пуэрто-Мадеро — бывшем старом порту, который в конце XX века превратился в самый престижный квартал города. Здесь кирпичные здания старой портовой инфраструктуры стали ресторанами и кафе, а декоративные краны оставили как памятники. По докам прогуляться приятно особенно вечером: набережная с подсветкой, яхты, виды на небоскрёбы. У причала стоят два корабля-музея: фрегат «Президент Сармиенто» и старинный корвет «Уругвай»."
  - paragraph:
    - link "Что посмотреть в столице Аргентины → отдельный гайд по Буэнос-Айресу":
      - /url: https://youtravel.me/blog/planiruem-puteshestvie/dostoprimechatelnosti-buehnos-ajresa
  - paragraph
  - heading "Музеи Буэнос-Айреса" [level=3]
  - paragraph: "Буэнос-Айрес — один из главных культурных центров Латинской Америки: здесь работают десятки музеев, галерей и культурных пространств. Расскажем про главные."
  - paragraph: MALBA (Музей латиноамериканского искусства) собрал коллекцию из произведений Фриды Кало, Диего Риверы, Фернандо Ботеро и других главных художников региона. Музей основан на частной коллекции аргентинского мецената и ежегодно принимает около трёх миллионов посетителей.
  - paragraph
  - img "Картина и статуя"
  - paragraph
  - text: Музей небольшой, но стоит посещения хотя бы ради работ Фриды Кало!
  - paragraph
  - paragraph
  - paragraph: Национальный музей изящных искусств — крупнейший художественный музей страны. Расположен в районе Реколета, в двух шагах от кладбища. Здесь хранятся полотна европейских мастеров — Эль Греко, Рубенса, Гойи, Ренуара — а также латиноамериканские художники. Вход бесплатный.
  - paragraph
  - img "Статуи"
  - paragraph
  - text: Музей бесплатный, но на входе можно оставить любую сумму в качестве поддержки фонду
  - paragraph
  - paragraph
  - paragraph: Museo de Arte Moderno de Buenos Aires (Музей современного искусства) расположен в районе Сан-Тельмо, в кирпичных стенах бывшего склада табачной фабрики XIX века. Коллекция насчитывает более 7 000 произведений — живопись, скульптура, фотография, видеоарт и инсталляции. Здесь есть работы Пикассо, Шагала, Дали и Матисса, а также крупнейшее в мире собрание аргентинского искусства XX–XXI веков. Удобно совмещать с прогулкой по антикварному рынку Сан-Тельмо в воскресенье.
  - paragraph
  - blockquote:
    - paragraph: "Я бы добавила сюда еще одно место — книжный магазин в здании старого театра. Позолоченные ложи, расписной купол, сцена, превращённая в кафе — и повсюду книги: в партере, в холлах, на ярусах. Это место бесплатно для посещения. Называется El Ateneo Grand Splendid, находится на главной торговой улице Santa Fe."
    - text: Анна путешественница
  - paragraph
  - paragraph

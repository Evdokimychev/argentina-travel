  - text: 5.0 17.07.2026
  - 'link "За гранью воображения: Величие Перито Морено, мощь Игуасу, энергия Рио!"':
    - /url: https://youtravel.me/tours/75064/%D0%B7%D0%B0_%D0%B3%D1%80%D0%B0%D0%BD%D1%8C%D1%8E_%D0%B2%D0%BE%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F_%D0%B2%D0%B5%D0%BB%D0%B8%D1%87%D0%B8%D0%B5_%D0%BF%D0%B5%D1%80%D0%B8%D1%82%D0%BE_%D0%BC%D0%BE%D1%80%D0%B5%D0%BD%D0%BE_%D0%BC%D0%BE%D1%89%D1%8C_%D0%B8%D0%B3%D1%83%D0%B0%D1%81%D1%83_%D1%8D%D0%BD%D0%B5%D1%80%D0%B3%D0%B8%D1%8F_%D1%80%D0%B8%D0%BE_
  - text: Спасибо с Женечка за такие впечатления. Увидела на старости лет все что хотела, ну все можно и помирать 🫢😀. Водопады одним словом мощь, нужно увидеть такое каждому, ледник прекрасен, красота неописуемая. Наша группа очень радовалась купанию в Рио де Жанейро, не а я плавать не умею, но было очень приятно посмотреть на волны. Спасибо. Маргарита
  - img
  - text: 5.0 06.07.2026
  - link "Вся Патагония — от Озёрного края до Магелланова пролива!":
    - /url: https://youtravel.me/tours/74476/%D0%B2%D1%81%D1%8F_%D0%BF%D0%B0%D1%82%D0%B0%D0%B3%D0%BE%D0%BD%D0%B8%D1%8F_%D0%BE%D1%82_%D0%BE%D0%B7%D1%91%D1%80%D0%BD%D0%BE%D0%B3%D0%BE_%D0%BA%D1%80%D0%B0%D1%8F_%D0%B4%D0%BE_%D0%BC%D0%B0%D0%B3%D0%B5%D0%BB%D0%BB%D0%B0%D0%BD%D0%BE%D0%B2%D0%B0_%D0%BF%D1%80%D0%BE%D0%BB%D0%B8%D0%B2%D0%B0_
  - text: "Лично для меня в успехе любого путешествия важны три составляющих — красота и девственность Природы, вкусная кухня и «движуха» (желательно в интересной компании единомышленников)! И в этом путешествии, все три фактора оказались на высшем уровне! Природа в Патагонии вне всякой конкуренции! Для любителей первозданной красоты нашей планеты, нетронутой человеческой цивилизацией, юг Аргентины и Чили — это настоящий рай! Удивительно красивые горы, причудливой формы скалы, чистейшие озера, фьорды, водопады, завораживающие своей красотой и мощью ледники, мраморные пещеры, фантастическое небо! А вода в озерах и реках не переставала удивлять своим цветовым разнообразием: изумрудная, синяя, красная, серая, белая, черная! Я даже не знала, что вода может быть таких ярких и неожиданных цветов! И каждый день этот потрясающе красивый и восхитительный визуальный ряд менялся! Спасибо нашему Гиду! Дмитрий идеально продумал и организовал маршрут, показав нам самое красивое и интересное, куда не каждый местный житель может забрести, не говоря уже о туристах! Это самый большой кайф — путешествовать с человеком, который ЗНАЕТ и ЛЮБИТ СТРАНУ! А если он еще и профессиональный фотограф, так это вообще ТУРИСТИЧЕСКИЙ ОРГАЗМ! Т.к. в «нужном месте» важно еще казаться в «нужное время», восходы и закаты в Андах и Озерном краю оставили просто неизгладимое впечатление на всю жизнь!!! Мы были в Патагонии осенью и, хочу отдельно сказать, что осень — отличное время для поездки: тепло, красиво, сухо, ярко и мало туристов, остановиться на ночь можно везде без проблем! Так что всем рекомендую! Это действительно было круто и незабываемо! Теперь еще очень хочется съездить на север Аргентины и в Боливию с Димой! (Но Дима меня теперь никуда не возьмет, поскольку я слишком долго писала отзыв))"

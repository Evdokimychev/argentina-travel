  - heading "Гид по отдыху в Аргентине – поездка на родину танго" [level=2]
  - paragraph: Аргентина, благодаря огромным размерам популярна у туроператоров и туристов. По площади государство занимает восьмое место в мире. За счет протяженности в 3 800 км с севера на юг природа отличается узкими горными цепями, тропическими лесами, многокилометровыми песчаными пляжами, голубыми озёрами, водопадами и мощными ледниками, как Перито - Морено.
  - paragraph: Национальные символы и традиции регионов страны поражают многообразием. Это государство, где зародился уникальный танец танго, блюда с чили, красочные костюмированные фестивали, во время которых улицы Аргентины превращаются в танцпол.
  - paragraph: Страну считают крупнейшим производителем вина в мире. Многие экскурсионные туры в Аргентину включают посещение известных винодельческих заводов, знакомство с их продукцией и архитектурой.
  - heading "Чем заняться в Аргентине" [level=2]
  - paragraph: "Ежегодно толпы путешественников приезжают в Аргентину на экскурсии для знакомства с природными достопримечательностями. В стране найдётся всё для весёлого отдыха на 2 человека и целой компании или семьи. Любая персональная программа туров или комбинированная предусматривает:"
  - list:
    - listitem: Отдых у водопадов Игуасу. Это 257 отдельных падающих с высоты потоков воды между Аргентиной и Бразилией. Причём обе страны имеют достопримечательности, входящие в ЮНЕСКО.
    - listitem: Знакомство и контакты с хиппи недалеко от Чили в деревне Эль Болсон. Это уникальная возможность поучаствовать в неформальном движении, которое поддерживают местные жители.
    - listitem: Дегустацию лучших сортов аргентинских вин в Мендосе. В столице одноимённой провинции ежегодно проводится винный фестиваль в честь сбора урожая.
    - listitem: Морские круизы, поиск редких ракушек и камней на пляжах.
    - listitem: Прогулки и фотосессии в известных городах - Барилоче и Калафате.
  - paragraph: Если выбор места для отпуска падает на Аргентину, обязательно посетите ежегодный фестиваль танго, где можно увидеть яркие и необычные костюмы танцоров. Причём туристы могут не только наблюдать за праздником, но и принять в нём активное участие.
  - heading "Лучшие места для посещения в Аргентине" [level=2]
  - paragraph: После перелёта из родного города в прекрасную Аргентину вас ждёт столица страны. Это место приятных рассветов и незабываемых ночей. Город Буэнос-Айрес с его магией и историей примечателен центром Ла-Бога, старинными постройками, церквями и площадями. Прогуливаясь вдоль набережной Ла-Костаньера можно часами любоваться особняками и вилами.
  - paragraph:
    - link "Шопоголики":
      - /url: https://youtravel.me/tours/type/%D1%88%D0%BE%D0%BF%D0%BF%D0%B8%D0%BD%D0%B3_%D1%82%D1%83%D1%80%D1%8B
    - text: обязаны посетить район Пласа-Доррего, и купить на рынках подарки домашним и себе. Цены на товары в столице не маленькие, а вот отели подходят по стоимости туристам на любой кошелёк.
  - paragraph: Для духовных путешественников и йогов для посещения подойдёт город Сальта. Он является местом важнейших религиозные построек. Каждый год паломники приезжают сюда, чтобы побывать на службе в соборе Сан-Франциско. Самые популярные памятники - монумент Христу Чудотворцу и Деве Марии.
  - paragraph: Для пляжного отдыха лучше приезжать в Мар-дель-Плата. Это курорт, где мягкий климат и километры белого песка. Гости курортного города часто отправляются в аквариумы или дельфинарии. Это отличное место для отдыха всей семьёй, которое ежегодно посещает почти 6 млн. путешественников.
  - heading "Советы" [level=2]
  - paragraph: Аргентина не самая безопасная страна для одиночного направления. Спокойнее вы будете чувствовать себя в группе туристов или в паре с партнером. Не рекомендуется самостоятельно прогуливаться за пределами туристического центра, как и не садиться в автомобиль без официальных знаков такси.
  - paragraph: "А в остальном гостям государства не повредят советы:"
  - list:
    - listitem: Отправляясь в пригород, снимите наличку в одном из проверенных банков. Пользоваться услугами уличных менял нежелательно. В крупных городах можно рассчитываться картой.
    - listitem: Не купаться в запрещенных местах. На многих аргентинских пляжах возле берега сильное течение. Внимательно смотрите на предупреждающие знаки.
    - listitem: В солидных ресторанах не стоит оставлять чаевые. В Аргентине принято включать дополнительную оплату за сервис в основной счёт.
  - paragraph: Из-за принятого антитабачного закона курение в местах скопления людей запрещено. Это касается ресторанов, баров и ночных клубов. Курить разрешено в специальном изолированном помещении.

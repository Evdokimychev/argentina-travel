  - text: "Спасибо Роману за потрясающий тур по Аргентине и на карнавал в Бразилии! Всё было организовано на высшем уровне: отличные отели, продуманный маршрут и море ярких впечатлений. Особенно порадовало, что в программе был легендарный отель Belmond у водопадов Игуасу это сделало путешествие ещё более особенным. Рекомендую всем!"

  - text: Спасибо с Женечка за такие впечатления. Увидела на старости лет все что хотела, ну все можно и помирать 🫢😀. Водопады одним словом мощь, нужно увидеть такое каждому, ледник прекрасен, красота неописуемая. Наша группа очень радовалась купанию в Рио де Жанейро, не а я плавать не умею, но было очень приятно посмотреть на волны. Спасибо.

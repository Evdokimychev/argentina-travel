  - text: Николай
  - heading [level=1]
  - text: Был(а) на сайте сегодня в 10:09 Здравствуйте, меня зовут Николай На YouTravel.me с декабря 2022
  - link:
    - /url: /upload/main/cb9/4btt0aua040dw81u1892ntnxk23354o9.jpg
  - text: Турция, Анталия Знаю Русский, Английский 46 стран посещено 2ч. Проверенный участник
  - link "55 отзывов":
    - /url: ""
  - paragraph: Люблю горы и влюбляю в них! Организую и провожу активные путешествия с 2010 года. Широкий спектр программ от несложного треккинга до серьёзных восхождений по всему миру. Ликийская тропа, Патагония, Гималаи, Кавказ, Альпы, Памир, Тянь-Шань, Анды и другие горы. В прошлом КМС по парашютному спорту и ак Больше
  - text: Николай подтвердил Личный e-mail Документы Номер телефона Facebook Вконтакте Команда Познакомьтесь с дружной командой. Эти ребята сделают ваше путешествие незабываемым! Елена Гид по Ликийской тропе, Патагонии, Кавказу и другим любимым местам. Родилась в Казахстане, с детства ходила по горам Алматы. Совершила восхождения на Эльбрус и другие горы. Живёт в Анталии и можно ска... +ещё
  - img "Предлагаю вам только самые лакомые кусочки тропы, пропуская менее интересное. Путешествуем с комфортом. Ходим налегке."

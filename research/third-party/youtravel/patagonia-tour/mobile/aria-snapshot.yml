  - text: 5.0 2 марта 2026 Если вы не любите пассивный отдых и жаждете единения с природой, но не готовы отказаться от комфорта надолго, то этот тур для вас! Здесь вы в полной мере насладитесь невероятными красотами нашей красавицы-планеты, влюбитесь в аргнетинскую и чилийскую Патагонию, преклонитесь перед величием Анд и успеете почувствовать вековой холод исчезающих ледников. Но при этом будете ночевать в комфортных апартаментах. Две недели были настолько насыщены впечатлениями, что пролетели как один миг. Николай - отличный гид, ненавязчиво и очень профессионально огранизовал наш отдых, предусмотрев всё до мелочей. При этом положительно отзывался на все наши "хотелки". Спасибо большое! С удовольствием попутешествуем с ним ещё куда-нибудь!

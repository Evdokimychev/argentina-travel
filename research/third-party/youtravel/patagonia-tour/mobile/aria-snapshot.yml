  - text: Екатерина
  - img
  - text: 5.0 8 февраля 2026 Чем понравилось - все четко организовано, апартаменты приличные, транспорт отличный, были даже новые микроавтобусы мерседесы с вай-фаем, всегда чистые с большими панорамными окнами. Программу выполнили и перевыполнили. Хорошее соотношение цены и качества. Потрясающие места, очень красиво, пока можешь взбираться на кручу, нужно обязательно побывать. В ресторанах вкусно, баранина, стейки, краб, хорошее вино и местное пиво. С погодой повезло, было много солнца. Междугородний автобус из Аргентины в Чили очень комфортный, с туалетом, кондиционером и остановками, лучше, чем Сапсан. Видели много воды и животных - озера, заливы, ледники, много бело-голубого неба и гуанако, зайцев, лису, кондора, пингвинов, бакланов, морских котиков, альбатросов. Полюбовались видами со многих мирадоров. Группа была очень отличная и под командованием опытного, спокойного, спортивного гида вела себя хорошо, никто не суетился, потому что ни о чем не беспокоился. При под’еме с большим набором высоты есть опции для тех, кто послабее - остаться, подождать. Так вся команда идет дружно и туристы ждут друг друга. Понравился местный трудолюбивый и доброжелательный народ, жители любят собак и кошек, слушают старый рок, в палисадниках цветы. Есть спортивные магазины, не мощный выбор, но все же есть, что-то купили. Много ездим в группах, одна из лучших поездок по организации и атмосфере и однозначно топ в сравнении с Новой Зеландией и ЮАР, пингвины, ледники, вино, мясо есть и еще трекинги более красивые и местные люди не индонезийские или африканские племена, а симпатичные латиносы в беретах как у Че Гевары. За все это плюс заботу, за отличный отдых, спасибо Николаю!

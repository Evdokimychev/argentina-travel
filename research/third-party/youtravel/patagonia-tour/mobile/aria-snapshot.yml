  - text: Люблю горы и влюбляю в них! Организую и провожу активные путешествия с 2010 года. Широкий спектр программ от несложного треккинга до серьёзных восхождений по всему миру. Ликийская тропа, Патагония, Гималаи, Кавказ, Альпы, Памир, Тянь-Шань, Анды и другие горы. В прошлом КМС по парашютному спорту и активный фрирайдер, сейчас сосредоточился на треккинге и восхождениях. Организуя и проводя путешествия, я занимаюсь любимым делом, от которого получаю удовольствие, поэтому стараюсь сделать всё максимально качественно. Это касается насыщенности поездки яркими впечатлениями, оптимального прохождения маршрута, безопасности участников и заботы об их здоровье, подбора гостиниц, кафе и всех прочих элементов отличного путешествия. Хорошая, дружная атмосфера в группе — крайне важная особенность наших поездок. Как правило, мы отлично проводим время и на треке и вечером за ужином, люди становятся друзьями, продолжают общаться, встречаться, вместе едут в новое путешествие. Присоединяйтесь, будет здорово!

    - /url: https://youtravel.me/tours/type/%D1%82%D1%83%D1%80_%D0%B2_%D0%B3%D0%BE%D1%80%D1%8B
  - paragraph: Пройтись по Огненной Земле, плавать среди айсбергов, увидеть обрушение ледника Перито Морено, башни Торрес Дель Пайне, громады Сьерро Торре и Фитцрой, Ушуайю, гуанако, пингвинов и многое другое это может случиться с вами уже в этой жизни!
  - paragraph: Уникальное сочетание отборных треков и водных круизов среди айсбергов и пингвинов.
  - paragraph: Ночуем в гостиницах или апартаментах, без палаток.
  - paragraph: Ходим в трекинг без тяжелых рюкзаков. Маршруты большие и насыщенные, но протяженность выхода можно будет индивидуально варьировать.
  - paragraph: Ездим в основном на групповых трансферах или высоко комфортабельных междугородних автобусах.
  - paragraph: Плаваем на кораблях на экскурсии по ледниковым лагунам и проливу в районе Огненной Земли.
  - paragraph: Все выходы в нашем туре по Патагонии будут без рюкзаков. Мы возьмём с собой лишь маленькие рюкзачки с дополнительной одеждой, дождевиком, перекусом и водой.
  - paragraph: У нас будут большие выходы по самым популярным трекам к самым красивым местам. Также будет много средних и маленьких выходов, когда нужно будет немного пройти от стоянки автомобиля до видовой точки.
  - paragraph: Протяженность больших выходов можно будет варьировать. Если вам будет тяжело идти весь трек, в любой момент можно будет вернуться назад по той же тропе. Все тропы хорошо промаркированы.
  - list:
    - listitem: Мы выбрали для вас, то что впечатлило нас больше всего в Патагонии. Увлекательные треки, плавание на кораблях к уникальным местам, топовые виды и диковины. Покажем всё то, что здесь любим!
    - listitem: "Мы побываем в самых интересных местах Патагонии. Чилийский парк Torres del Paine (Торрес дель Пайне) с одноимёнными башнями. Аргентинский Los Glaciares (Лос Гласьярес) с легендарными горами Сьерро Торре и Фитцрой. Огромный подвижный ледник Перито Морено, который будет рушиться у вас на глазах. Ледники на озере Архентино. Огненная Земля и самый южный город планеты Ушуайя. А также диковинный животный мир: дикие гуанако, страусы, кондоры, пингвины, морские котики и прочие."
    - listitem: Маршрут спланирован как оптимальное сочетание переездов и пешего трекинга без рюкзаков для того, чтобы увидеть всё самое интересное, не потратив на это слишком много времени и денег.

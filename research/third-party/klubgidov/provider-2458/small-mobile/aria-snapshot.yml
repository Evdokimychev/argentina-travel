- heading "Отзывы" [level=2]
- list:
  - listitem:
    - text: Е Екатерина о туре -
    - link "Незабываемые дни на берегах Невы. Неделя в Санкт-Петербурге":
      - /url: /rossiya/leningradskaya-oblast/nezabyvaemye-dni-na-beregah-nevy-239443
    - text: 21 авг. 2025 Добрый день! Поезда прошла отлично. Нам все очень понравилось. Вокруг была такая красота не описать словами. Мы получили большое число эмоций 😁. Отличная идея в программе связанна с поездкой в Карелию, такая смена программы очень клевая идея. ☺️ Марианна, отдельное спасибо вам за помощь с подбором программы, за сопровождение с момента выбора до самого путешествия 🙂
    - button "Читать далее"
  - listitem:
    - text: А Анна о туре -
    - link "Классический летний Петербург на 5 дней":
      - /url: /rossiya/leningradskaya-oblast/klassicheskij-peterburg-248907
    - text: 16 июн. 2024 Добрый день. Нашей поездкой мы остались очень довольны. Гостиница, экскурсовод, сама программа оправдали наши ожидания. Очень переживала, так как впервые бронировала тур таким образом, но все сложилось отлично! Спасибо за организацию нашего путешествия и за вашу работу Питер безусловно покорил наши сердца ❤️
    - button "Читать далее"
  - listitem: М Максим об организаторе 7 мая 2025 Все прошло хорошо.
- button "Показать больше отзывов"

- heading "Привет, я Анна" [level=1]
- paragraph: Правильные туры в Петербург
- img
- strong: "4.9"
- img
- text: 925 отзывов
- paragraph: "В туризме работаю более 15 лет. Развиваясь эти годы «шаг за шагом», мы стали одним из ведущих туроператоров Санкт-Петербурга. Опыт и профессиональная команда, приобретенные за это время, позволяют нам максимально качественно осуществлять прием российских и иностранных туристов в Санкт-Петербурге и Ленинградской области, а также организовывать туры по всему Северо-Западу России: в Карелию, Великий Новгород, Псков, Калининград, Мурманск."

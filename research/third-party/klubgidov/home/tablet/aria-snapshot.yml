  - 'link "Что купить в Стамбуле: лучшие сувениры и подарки 26 июня 2026 Что купить в Стамбуле: лучшие сувениры и подарки В этом обзоре рассказываем, что привезти из Стамбула: к каким продуктам, косметическим средствам, текстильным и ремесленным изделиям стоит присмотреться и где их искать. От ароматного кофе, специй и сладостей до мозаичных ламп, керамики и изделий из кожи на турецких рынках и в аутентичных лавках — в подарок близким или себе на память о путешествии."':
    - /url: /journal/chto-privezti-iz-stambula-587
    - 'img "Что купить в Стамбуле: лучшие сувениры и подарки"'
    - text: "26 июня 2026 Что купить в Стамбуле: лучшие сувениры и подарки В этом обзоре рассказываем, что привезти из Стамбула: к каким продуктам, косметическим средствам, текстильным и ремесленным изделиям стоит присмотреться и где их искать. От ароматного кофе, специй и сладостей до мозаичных ламп, керамики и изделий из кожи на турецких рынках и в аутентичных лавках — в подарок близким или себе на память о путешествии."
  - 'link "Норвежские фьорды: мир отвесных скал, водопадов и ледников 22 июня 2026 Норвежские фьорды: мир отвесных скал, водопадов и ледников Норвежские фьорды формировались миллионы лет, а сегодня входят в число самых впечатляющих природных ландшафтов мира. Рассказываем, как возникли эти удивительные морские заливы, чем знаменит «Король фьордов», где находятся самые живописные смотровые площадки и какие точки включить в маршрут по Норвегии."':
    - /url: /journal/fordy-norvegii-585
    - 'img "Норвежские фьорды: мир отвесных скал, водопадов и ледников"'
    - text: "22 июня 2026 Норвежские фьорды: мир отвесных скал, водопадов и ледников Норвежские фьорды формировались миллионы лет, а сегодня входят в число самых впечатляющих природных ландшафтов мира. Рассказываем, как возникли эти удивительные морские заливы, чем знаменит «Король фьордов», где находятся самые живописные смотровые площадки и какие точки включить в маршрут по Норвегии."
  - 'link "Озёра Казахстана: самые красивые и необычные водоёмы страны 2 июня 2026 Озёра Казахстана: самые красивые и необычные водоёмы страны Озёра Казахстана многочисленны и не похожи друг на друга. Некоторые из них сравнимы с морями, другие прячутся среди горных вершин — их красота доступна любителям треккинга и ночёвок в палатках. А тем, кто ищет чего-то необыкновенного, стоит увидеть солёные озёра с их фантастическими пейзажами."':
    - /url: /journal/ozera-kazahstana-581
    - 'img "Озёра Казахстана: самые красивые и необычные водоёмы страны"'
    - text: "2 июня 2026 Озёра Казахстана: самые красивые и необычные водоёмы страны Озёра Казахстана многочисленны и не похожи друг на друга. Некоторые из них сравнимы с морями, другие прячутся среди горных вершин — их красота доступна любителям треккинга и ночёвок в палатках. А тем, кто ищет чего-то необыкновенного, стоит увидеть солёные озёра с их фантастическими пейзажами."

  - 'link "Норвежские фьорды: мир отвесных скал, водопадов и ледников 22 июня 2026 Норвегия Норвежские фьорды: мир отвесных скал, водопадов и ледников Норвежские фьорды формировались миллионы лет, а сегодня входят в число самых впечатляющих природных ландшафтов мира. Рассказываем, как возникли эти удивительные морские заливы, чем знаменит «Король фьордов», где находятся самые живописные смотровые площадки и какие точки включить в маршрут по Норвегии."':

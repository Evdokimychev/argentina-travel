      - listitem: Сингапур
    - text: "Сингапур: от небоскрёбов до джунглей и мангровых зарослей Сингапур относится к самым маленьким государствам на Земле. Его площадь меньше 800 км², и проехать его из конца в конец можно примерно за час. Но интересные места в Сингапуре встречаются на каждом шагу и начинаются уже в аэропорту. Впечатляющая архитектура, музеи мирового класса, роскошные торговые центры, сады с бабочками и орхидеями — куда бы вы ни отправились, везде найдете что-то удивительное. При этом тратить время на долгие переезды не нужно, так что даже короткий отпуск получается насыщенным и полным впечатлений. Сегодня мы расскажем, что можно посмотреть в Сингапуре, чтобы вы могли спланировать путешествие."
  - 'link "Самые красивые озёра Азии: от Байкала до Тянь-Шаня и других живописных водоёмов 18 ноября 2025 Турция, Армения, Узбекистан, Киргизия, Казахстан, Таджикистан, Монголия, Иран, Байкал, Вьетнам, Китай, Туркменистан Самые красивые озёра Азии: от Байкала до Тянь-Шаня и других живописных водоёмов На просторах Азии много природных чудес, и важное место среди них занимают озера. Они невероятно разнообразны. Одни так велики, что их называют морями, другие — совсем небольшие, но привлекают необычайной красотой или уникальной экосистемой. Известные на весь мир и привлекающие множество туристов. И скрытые жемчужины, ожидающие любителей уединения среди лесов, в горах и даже в пещерах. В этой статье мы расскажем про озера, расположенные в разных уголках Азии — читайте и планируйте путешествие, полное новых открытий."':
    - /url: /journal/ozera-azii-523
    - 'img "Самые красивые озёра Азии: от Байкала до Тянь-Шаня и других живописных водоёмов"'
    - text: 18 ноября 2025
    - list:
      - listitem: Турция,
      - listitem: Армения,
      - listitem: Узбекистан,
      - listitem: Киргизия,
      - listitem: Казахстан,
      - listitem: Таджикистан,
      - listitem: Монголия,
      - listitem: Иран,
      - listitem: Байкал,
      - listitem: Вьетнам,
      - listitem: Китай,
      - listitem: Туркменистан
    - text: "Самые красивые озёра Азии: от Байкала до Тянь-Шаня и других живописных водоёмов На просторах Азии много природных чудес, и важное место среди них занимают озера. Они невероятно разнообразны. Одни так велики, что их называют морями, другие — совсем небольшие, но привлекают необычайной красотой или уникальной экосистемой. Известные на весь мир и привлекающие множество туристов. И скрытые жемчужины, ожидающие любителей уединения среди лесов, в горах и даже в пещерах. В этой статье мы расскажем про озера, расположенные в разных уголках Азии — читайте и планируйте путешествие, полное новых открытий."
  - 'link "Достопримечательности Туркменистана: города Шелкового пути и необыкновенные ландшафты в сердце Азии 28 октября 2025 Туркменистан Достопримечательности Туркменистана: города Шелкового пути и необыкновенные ландшафты в сердце Азии Туркменистан — загадочная страна, полная контрастов. Украшенные мрамором улицы Ашхабада соседствуют с дикими бескрайними просторами, а руины древних городов хранят ушедшие в прошлое маршруты Шелкового пути. Когда-то этот регион находился на перекрестке великих цивилизаций, поэтому в Туркменистане много исторических мест, напоминающих о славном прошлом."':
    - /url: /journal/dostoprimechatelnosti-turkmenistana-516
    - 'img "Достопримечательности Туркменистана: города Шелкового пути и необыкновенные ландшафты в сердце Азии"'
    - text: 28 октября 2025
    - list:
      - listitem: Туркменистан
    - text: "Достопримечательности Туркменистана: города Шелкового пути и необыкновенные ландшафты в сердце Азии Туркменистан — загадочная страна, полная контрастов. Украшенные мрамором улицы Ашхабада соседствуют с дикими бескрайними просторами, а руины древних городов хранят ушедшие в прошлое маршруты Шелкового пути. Когда-то этот регион находился на перекрестке великих цивилизаций, поэтому в Туркменистане много исторических мест, напоминающих о славном прошлом."
  - 'link "Озера Европы: идеи для отдыха среди живописных пейзажей 21 октября 2025 Франция, Италия, Черногория, Албания, Швейцария, Хорватия, Словения, Венгрия, Германия Озера Европы: идеи для отдыха среди живописных пейзажей Отдых в Европе ассоциируется со средневековой архитектурой, музейными сокровищами и роскошными морскими пляжами. Но есть прекрасный вариант — пресноводные озера Европы, расположенные по всей ее территории. Некоторые из них так велики, что их сравнивают с морями. Другие, необычайно живописные, находятся в национальных парках или окружены альпийскими вершинами. Третьи привлекают загадочными историями и достопримечательностями вокруг."':
    - /url: /journal/ozera-evropy-514
    - 'img "Озера Европы: идеи для отдыха среди живописных пейзажей"'
    - text: 21 октября 2025
    - list:
      - listitem: Франция,
      - listitem: Италия,
      - listitem: Черногория,
      - listitem: Албания,
      - listitem: Швейцария,
      - listitem: Хорватия,
      - listitem: Словения,
      - listitem: Венгрия,
      - listitem: Германия
    - text: "Озера Европы: идеи для отдыха среди живописных пейзажей Отдых в Европе ассоциируется со средневековой архитектурой, музейными сокровищами и роскошными морскими пляжами. Но есть прекрасный вариант — пресноводные озера Европы, расположенные по всей ее территории. Некоторые из них так велики, что их сравнивают с морями. Другие, необычайно живописные, находятся в национальных парках или окружены альпийскими вершинами. Третьи привлекают загадочными историями и достопримечательностями вокруг."
  - link "Черепаха как еда или про необычный деликатес на китайском рынке 6 октября 2025 Китай Черепаха как еда или про необычный деликатес на китайском рынке Вообще-то я очень люблю пробовать необычные вкусности в разных странах. Кухни народов мира разнообразны и удивительны. Но, как говорят, человечество ни в чём не столь консервативно, как в гастрономических и религиозных предпочтениях.":

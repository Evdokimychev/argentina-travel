    - text: "Лучшие места ЮАР для незабываемого путешествия ЮАР невероятно многогранна: у ее берегов встречаются два океана, а на суше саванны и древние горы соседствуют с яркими мегаполисами. Это одно из лучших мест для знакомства с уникальной африканской природой. Ежегодно страну посещает несколько миллионов туристов. Гости приезжают сюда отовсюду ради невероятных пейзажей, потрясающих сафари и культурного разнообразия. Чтобы помочь вам спланировать увлекательное путешествие, мы подготовили список важнейших достопримечательностей ЮАР и сгруппировали их по регионам."

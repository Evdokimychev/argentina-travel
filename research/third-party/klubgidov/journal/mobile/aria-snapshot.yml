    - list:
      - listitem: Малайзия
    - text: "Главные достопримечательности Малайзии: небоскрёбы, парк птиц и небесный мост Богатая культура и красота природы делают Малайзию одним из интереснейших мест в мире. Многонациональная страна, расположенная на перекрестке торговых путей, удивит вас разнообразием. Пышные джунгли соседствуют с высотными мегаполисами, яркие запахи специй смешиваются с легким ароматом морского бриза, многовековые традиции сочетаются с современным укладом жизни. Мы подготовили список живописных и увлекательных локаций Малайзии. Города с современной и колониальной архитектурой, острова с прекрасными пляжами, чайные плантации. Читайте и планируйте путешествие, полное ярких впечатлений."
  - 'link "Достопримечательности Мексики: пляжи, подводный музей и наследие Майя 11 декабря 2025 Мексика Достопримечательности Мексики: пляжи, подводный музей и наследие Майя Мексика привлекает гостей со всего мира. Здесь можно увидеть современные мегаполисы, безмятежные колониальные городки и древние пирамиды майя. Любителей красивой природы ждут бирюзовые воды Карибского моря, тропические леса, вулканы и глубокие каньоны. К этим чудесам добавляется мексиканская кухня с яркими вкусами и богатая культура страны. Далее мы расскажем подробнее, что из достопримечательностей Мексики стоит посмотреть туристу. Погрузитесь в атмосферу этой удивительной страны и спланируйте путешествие, полное открытий."':
    - /url: /journal/dostoprimechatelnosti-meksiki-530
    - 'img "Достопримечательности Мексики: пляжи, подводный музей и наследие Майя"'
    - text: 11 декабря 2025
    - list:
      - listitem: Мексика
    - text: "Достопримечательности Мексики: пляжи, подводный музей и наследие Майя Мексика привлекает гостей со всего мира. Здесь можно увидеть современные мегаполисы, безмятежные колониальные городки и древние пирамиды майя. Любителей красивой природы ждут бирюзовые воды Карибского моря, тропические леса, вулканы и глубокие каньоны. К этим чудесам добавляется мексиканская кухня с яркими вкусами и богатая культура страны. Далее мы расскажем подробнее, что из достопримечательностей Мексики стоит посмотреть туристу. Погрузитесь в атмосферу этой удивительной страны и спланируйте путешествие, полное открытий."
  - 'link "Сингапур: от небоскрёбов до джунглей и мангровых зарослей 19 ноября 2025 Сингапур Сингапур: от небоскрёбов до джунглей и мангровых зарослей Сингапур относится к самым маленьким государствам на Земле. Его площадь меньше 800 км², и проехать его из конца в конец можно примерно за час. Но интересные места в Сингапуре встречаются на каждом шагу и начинаются уже в аэропорту. Впечатляющая архитектура, музеи мирового класса, роскошные торговые центры, сады с бабочками и орхидеями — куда бы вы ни отправились, везде найдете что-то удивительное. При этом тратить время на долгие переезды не нужно, так что даже короткий отпуск получается насыщенным и полным впечатлений. Сегодня мы расскажем, что можно посмотреть в Сингапуре, чтобы вы могли спланировать путешествие."':
    - /url: /journal/dostoprimechatelnosti-singapura-524
    - 'img "Сингапур: от небоскрёбов до джунглей и мангровых зарослей"'
    - text: 19 ноября 2025

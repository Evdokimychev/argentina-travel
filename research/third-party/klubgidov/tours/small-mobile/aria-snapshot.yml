- article:
  - paragraph: Если вы любите отдыхать нестандартно и вас не привлекают заезженные туристические маршруты, обратите внимание на «Клуб Гидов». Каждый маршрут в предложенных здесь авторских турах спроектирован так, чтобы вы ощутили себя дорогим гостем, которому друг показывает свои любимые места. Мы предлагаем только крафтовые и атмосферные туры по всему миру, цена на которые будет привлекательной.
  - paragraph: Площадка клуба помогает найти интересующее вас направление и выбрать увлекательный маршрут. Вы также сами определяете нужное вам количество дней отдыха. Если вам не с кем поехать — тоже не беда, ведь в «Клубе Гидов» есть туры, рассчитанные на тех, кто едет один. Так подбирается компания, и вы сможете найти новых друзей.
  - heading "Авторские туры по России в 2026—2027 году" [level=2]
  - paragraph: Многие путешественники выбирают туры по России, ведь наша страна огромна, и чтобы увидеть все интересные и отдаленные уголки, не хватит и года. Если вы думаете, что в России некуда ехать и нечего смотреть, кроме Москвы и Петербурга, взгляните на предложенные «Клубом Гидов» туры. Такое многообразие маршрутов и активностей — отличная возможность изучить страну изнутри. Авторские программы продуманы так, чтобы вы получили наслаждение от поездки и забыли о делах, сконцентрировавшись на своих желаниях. В таком виде отдыха вас ожидает множество приятных моментов, вы сможете прочувствовать быстротечность жизни, оценить богатую природу страны и буквально расширить горизонты.
  - heading "Авторские путешествия за границу в 2026—2027 году" [level=2]
  - paragraph: Развеяться за границей — один из любимых способов путешествий многих российских туристов. В таком отдыхе много положительных моментов, главный из которых — перезагрузка. Вы отдохнете от работы и рутины, сменив обстановку, а возможно, даже языковую среду. Поездки в другие страны — это всегда полезно. Вы познакомитесь с новой культурой, традиционной кухней, бытом и конечно знаменитыми достопримечательностями.
  - paragraph: На сайте есть возможность купить уникальный тур, который будет продуман до мелочей и создан под ваши запросы. Искать их очень просто благодаря обилию фильтров. Европа, Азия, Африка и Америка теперь намного ближе, чем кажется. И никаких проволочек с организацией и сборами — вам остается лишь собрать чемодан и не забыть хорошее настроение.
  - heading "Преимущества маркетплейса «Клуб Гидов»" [level=2]
  - paragraph: "Есть несколько важных плюсов нашего сайта, на которые вам стоит обратить внимание:"
  - list:
    - listitem: Туры напрямую от авторов. Вы бронируете тур без посредников и наценок. Взгляните на каталог, ознакомьтесь с предложенными программами и выберите ту, что подходит именно вам.
    - listitem: Проверенные авторы. Мы заботимся о вашей личной безопасности, и для этого каждый автор проходит обязательную верификацию.
    - listitem: Безопасная оплата. Все покупки оплачиваются с помощью безопасных сделок. Без комиссий или наценок.
    - listitem: Реальные отзывы. Чтобы сделать каждый туристический маршрут еще более интересным и уникальным, мы собираем отзывы туристов после путешествий. Так вам будет легче заказать тур, который вас впечатлит.

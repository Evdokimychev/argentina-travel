  - text: Не требует оплаты сейчас
  - paragraph: Это путешествие — как дорога сквозь четыре стихии. Мы увидим водопады Игуасу, услышим дыхание ледника Перито-Морено, почувствуем ветер Ушуайи и побываем на границе Чили и Аргентины, глядя на горы Торрес-дель-Пайне!
  - paragraph: Маршрут выстроен так, чтобы каждый день был новым открытием — от тропических джунглей до ледяных озёр, от грохота воды до полной тишины патагонской степи.
  - paragraph: Для кого этот трип? Для тех, кто хочет увидеть другой конец света, но без стресса — всё продумано, остаётся просто наслаждаться. Кому близка идея маленькой компании — до 8 человек, с кем легко, весело и без формальностей.
  - paragraph: "Кто хочет почувствовать настоящую Патагонию — ледники, океан, пингвины, горы и километры свободы. Кто ценит атмосферу: хорошие апарты, удобный транспорт, локальная еда и тёплые вечера за бокалом вина. Кто мечтал об Аргентине, но не знал с чего начать — мы всё собрали в одном маршруте!"
  - text: Канал Бигль Пройдём по маршруту мореплавателей и увидим маяк на краю света
  - img "Лагуна Эсмеральда"
  - text: Torres del Paine Увидим изумрудные озёра, ледники и водопады Пайне по ту сторону границы Эль-Чальтен Поднимемся к лагуне Капри с видом на острые пики Фиц-Роя Игуасу Одно из чудес света — десятки водопадов, где рев воды заглушает всё вокруг Перито-Морено Подплывём к гиганту — леднику, который живёт, трещит и рушится в озеро Пингвины и морские котики Отправимся по Каналу Бигль к островам, где пингвины и котики делят берег Ушуайя Проедем верхом на краю света — здесь горы встречаются с океаном

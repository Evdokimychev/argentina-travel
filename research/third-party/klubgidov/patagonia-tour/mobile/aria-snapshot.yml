  - text: Средний Не требует физической подготовки, но предполагает умеренную физическую нагрузку Комментарий организатора
  - paragraph: "В среднем 10-12 тыс. шагов в день, в активные дни до 15-18 тыс. Сложных многодневных треков нет, но тур активный: будут прогулки по Буэнос-Айресу, тропы в Tierra del Fuego, мостики у ледника Perito Moreno, короткие маршруты в Torres del Paine и много ходьбы у водопадов Игуасу. Обычно 2-4 часа пешком в день с паузами на отдых, еду, фото и “сфоткайте меня вот тут”. Тур подходит для обычной физической формы, если комфортно много ходить, гулять по тропам и спокойно переносить насыщенные дни с переездами :)"

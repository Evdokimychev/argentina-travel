    - listitem: В Валерия об организаторе 13 мая 2026 С нами катал Тема, очень интересно рассказывал про страну, отдельные города и сделал классные фотки
    - listitem:
      - text: С Светлана об организаторе 26 фев. 2026 Отлично организованный тур, насыщенная программа и разнообразие мест. Комфортная атмосфера и вкусная еда
      - img "Photo Р. Женя"
      - text: Р. Женя Спасибо! Стараемся)
    - listitem:
      - text: Д Дарья об организаторе 16 нояб. 2023 РОУД-ТРИП ПО СКРЫТЫМ ЖЕМЧУЖИНАМ ГРУЗИИ Отличный тур для тех, кто желает с комфортом посетить несколько городов Грузии, прокатиться по серпантинам, насладиться красивыми локациями, закатами и вкусной едой в небольшой компании молодых авантюристов. Тем, кто едет с целью узнать исторические сведения о местах, зданиях и памятниках, возможно будет не очень информативно. Несомненным плюсом для меня при выборе тура стало наличие в маршруте заброшек. Благодарна Жене за проведенный тур, за время которого мы подружились со всеми участниками и стали маленькой неразлучной семьей из четырех человек. Несмотря на возникшие трудности, в виде отключения воды сначала в Кутаиси, а затем воды и света в Тбилиси, проблемы с бронью гостевого дома в Сигнахи и периодического столкновения интересов участников тура, Женя старался создать комфортную атмосферу для всех, делал все возможное, что от него зависело и учитывал наши пожелания.

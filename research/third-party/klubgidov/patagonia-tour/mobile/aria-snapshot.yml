    - paragraph: Из Москвы в Буэнос-Айрес летают рейсы авиакомпаний Turkish Airlines и Qatar Airways с пересадками в Стамбуле или Дохе. Виза для граждан России не требуется, багаж включён в стоимость. Все внутренние перелёты по маршруту (Буэнос-Айрес — Ушуайя — Эль-Калафате — Пуэрто-Игуасу) уже входят в стоимость тура. Обратный вылет — из Пуэрто-Игуасу, но можно выбрать и возвращение через Буэнос-Айрес, если это удобнее или выгоднее.

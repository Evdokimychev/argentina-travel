  - paragraph: Добро пожаловать в Аргентину! Сегодня нас встречает Буэнос-Айрес — город контрастов, где старинные кварталы соседствуют с сияющими небоскрёбами.
  - paragraph: Вечером соберёмся за общим столом, попробуем настоящее аргентинское мясо на гриле и вместе отправимся на шоу танго.
  - paragraph: Это яркое представление с живой музыкой и страстными танцами станет настоящей визитной карточкой города и погрузит нас в атмосферу Буэнос-Айреса с первой же ночи :)

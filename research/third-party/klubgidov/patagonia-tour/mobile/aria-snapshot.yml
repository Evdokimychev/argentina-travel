  - strong: "Языки организатора:"
  - text: "Русский, Английский Привет! Я Женя — человек, который однажды слишком сильно полюбил путешествия. За плечами 35 стран: США, Исландия, Норвегия и еще много мест, куда хочется вернуться. Все началось в далеком 2018 году: я собирал друзей, придумывал маршрут, и мы вместе улетали исследовать новую страну ✈️ Потом подумал: а почему бы не собирать ребят, с которыми мы еще не знакомы? Так родился проект, которому я посвящаю 100% своего времени — путешествия, в которых незнакомые люди быстро превращаются в ту самую компанию, с которой хочется ехать дальше. Лично провел 80 туров, а вместе с нашей командой путешествовали уже более 500 человек ❤️ Еще я постоянно таскаю с собой плёночный фотоаппарат и Polaroid, так что помимо воспоминаний из поездки обычно остается пачка живых кадров :) Если тебе ближе приключение с друзьями, чем отпуск по расписанию туристического автобуса — залетай! Поехали открывать мир вместе!"
